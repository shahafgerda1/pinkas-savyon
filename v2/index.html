<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>פנקס התרגולים · סביון</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#54078F">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="פנקס התרגולים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@700;800&display=swap">
<style>
:root{
  --brand:#54078F; --brand-dark:#3B0566; --bg:#F6F3EA; --ink:#2B1245; --ink2:#5B4A70;
  --soft:#E9DFF3; --line:#B9A8CC; --card:#FFFFFF; --body:#3D2A55;
  --r:16px; --gut:16px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,sans-serif;font-size:16px;line-height:1.45;overflow-x:hidden}
a{color:var(--brand);text-decoration:none}
a:hover{color:var(--brand-dark)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:Rubik,sans-serif;margin:0}
.skip{position:absolute;right:8px;top:-80px;background:var(--brand);color:#fff;padding:10px 14px;border-radius:10px;z-index:50}
.skip:focus{top:8px;color:#fff}

.wrap{max-width:1080px;margin:0 auto;padding:24px var(--gut) 40px;display:flex;flex-direction:column;gap:20px;position:relative}
.narrow{max-width:760px}

/* כנפיים קבועות: תמיד באותה פינה, חוזרות לכריכה */
.homewing{position:absolute;top:20px;left:var(--gut);width:56px;height:44px;display:flex;align-items:center;justify-content:center}
.homewing img{width:56px;display:block}
/* כנפיים מסתתרות */
.hiderow{display:flex;height:44px;align-items:center}
.hidewing{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px}
.hidewing img{width:32px;opacity:.42;transition:opacity .2s}
.hidewing:hover img,.hidewing:focus-visible img{opacity:.8}
body.playing .hiderow{visibility:hidden}

/* כריכה */
.cover-hero{display:flex;flex-direction:column;gap:16px;padding:18px;border-radius:20px;background:linear-gradient(135deg,#EDE3F7 0%,#F6F3EA 70%)}
.cover-hero .search{max-width:none}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#fff}
.brand h1{font-weight:800;font-size:28px;line-height:1.1;color:var(--brand)}
.brand .sub{font-size:15px;color:var(--ink2)}
.seg{display:flex;gap:6px;padding:4px;background:var(--soft);border-radius:14px;max-width:520px}
.seg button{flex:1 1 0;min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:15px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;font-weight:700}
.sect{display:flex;flex-direction:column;gap:12px}
.sect h2{font-weight:700;font-size:20px}
.hint{font-size:14px;color:var(--ink2);margin:0}
.doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.door{display:flex;flex-direction:column;gap:8px;padding:14px;min-height:96px;background:var(--card);border-radius:var(--r);color:var(--ink)}
.door:hover{color:var(--ink);box-shadow:0 0 0 2px var(--line)}
.door .bar{width:28px;height:8px;border-radius:4px}
.door .t{font-family:Rubik,sans-serif;font-weight:700;font-size:17px;line-height:1.2}
.door .n{font-size:14px;color:var(--ink2)}
/* המהלך השנתי */
.mahalach .sel{font-weight:400;color:var(--ink2);font-size:.8em}
.mh{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mh a,.mh li.none{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px;border-radius:12px;background:var(--card);color:var(--ink)}
.mh a:hover{box-shadow:0 0 0 2px var(--line);color:var(--ink)}
.mh .num{flex-shrink:0;width:30px;height:30px;border-radius:15px;background:var(--soft);color:var(--brand);font-family:Rubik,sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.mh .tt{flex:1;font-weight:600}
.mh .c{font-size:14px;color:var(--ink2)}
.mh li.none{background:transparent;border:1px dashed var(--line);color:var(--ink2)}
.mh li.none .tt{font-weight:400}
.mh .mo{font-size:13px;color:#8A6408;font-weight:600}
.starthere{display:flex;flex-direction:column;gap:8px}
.starthere .k{font-size:13px;font-weight:700;color:#8A6408}
.stepnote{background:#FFFBF2;border-inline-start:4px solid #D9A51C;border-radius:12px;padding:10px 14px;white-space:pre-line}
.sub2{font-size:18px;margin-top:6px}
.season{background:var(--card);border-radius:var(--r);padding:14px 16px;border-inline-start:5px solid #D9A51C}
.season h2{font-size:18px}
.stepnav{justify-content:space-between}
.stepnav .btn{flex:0 1 auto}
/* הפוסטר "מיהו בוגר סביון?" וששת חלקי הפאזל עליו כאזורים לחיצים */
.poster{position:relative;margin:0;border-radius:var(--r);overflow:hidden;background:#fff;max-width:640px;align-self:center;width:100%}
.poster img{width:100%;height:auto;display:block}
.poster a{position:absolute;border-radius:14px;transition:background .15s,box-shadow .15s}
.poster a:hover,.poster a:focus-visible{background:rgba(84,7,143,.10);box-shadow:inset 0 0 0 3px var(--brand);outline:none}
.poster a .cnt{position:absolute;bottom:6px;left:6px;background:var(--brand);color:#fff;font-weight:700;font-size:12px;line-height:1;padding:5px 7px;border-radius:10px}
.door .thumbs{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.door .thumbs img{width:46px;height:46px;object-fit:cover;object-position:top;border-radius:9px;border:1px solid #EEE8F4;background:#fff}
.duo{display:flex;flex-direction:column;gap:12px}
.duo .acts{display:flex;flex-direction:column;gap:10px}
.door.empty{background:transparent;border:1px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:22px;background:var(--card);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip[aria-pressed="true"],.chip[aria-current="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.chip .c{font-weight:400;opacity:.75;font-size:14px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 calc(-1 * var(--gut));padding:2px var(--gut) 6px;scrollbar-width:thin}
.chips.scroll .chip{white-space:nowrap;flex-shrink:0}
h1[tabindex="-1"]:focus{outline:none}
.today{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);overflow:hidden;color:var(--ink);max-width:560px}
.today:hover{color:var(--ink);box-shadow:0 0 0 2px var(--line)}
.today img{width:100%;height:200px;object-fit:cover;object-position:top;display:block;background:#fff}
.today .in{display:flex;flex-direction:column;gap:4px;padding:14px}
.today .t{font-family:Rubik,sans-serif;font-weight:700;font-size:18px}
.today .m{font-size:15px;color:var(--ink2)}
.btn{min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:var(--brand);color:#fff;border:0;font-family:Rubik,sans-serif;font-weight:700;font-size:17px;padding:0 18px;text-align:center}
.btn:hover{background:var(--brand-dark);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--brand);color:var(--brand);min-height:48px;font-size:16px}
.btn.ghost:hover{background:var(--soft);color:var(--brand)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 160px}
.search{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink2);max-width:560px}
.search form{display:flex;gap:8px}
.search input{flex:1;min-width:0;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-family:Assistant,sans-serif;font-size:16px;color:var(--ink)}
.search button{height:48px;min-width:64px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700}

/* רשימה */
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:700;font-size:16px;align-self:flex-start;max-width:calc(100% - 72px)}
.back svg{flex-shrink:0}
.dhead{display:flex;flex-direction:column;gap:6px}
.dhead .bar{width:40px;height:8px;border-radius:4px}
.dhead h1{font-weight:800;font-size:28px;line-height:1.15}
.dhead .m{font-size:15px;color:var(--ink2)}
.chip.soon{opacity:.6;cursor:default;border-style:dashed}
.warnTag{align-self:flex-start;margin:0 12px 10px;font-size:13px;font-weight:700;color:#8A4B00;background:#FFF1D6;border-radius:8px;padding:2px 8px}
.card.text .warnTag{margin:6px 0 0}
.mats{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mats b{font-size:15px}
.desc{font-size:16px;line-height:1.5;color:var(--body);margin:0;max-width:720px}
.filt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.filt button{min-height:44px;border:0;background:none;color:var(--brand);font-weight:700;padding:0 6px;text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);overflow:hidden;color:var(--ink);min-height:100%}
.card:hover{color:var(--ink);box-shadow:0 0 0 2px var(--line)}
.card .ph{position:relative;background:#fff}
.card .ph img{width:100%;height:124px;object-fit:cover;object-position:top;display:block}
.card .badge{position:absolute;bottom:8px;right:8px;background:rgba(255,255,255,.94);color:var(--ink);font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px}
.card .tt{padding:10px 12px 14px;font-family:Rubik,sans-serif;font-weight:700;font-size:15px;line-height:1.25}
.card.text{padding:12px 12px 14px;gap:8px}
.card.text .top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2)}
.card.text .dot{width:20px;height:6px;border-radius:3px;flex-shrink:0}
.card.text .tt{padding:0}
.card.text .w{font-size:14px;color:var(--body);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.text .lay{font-size:13px;color:var(--ink2);margin-top:auto}
.empty-note{background:var(--card);border-radius:var(--r);padding:16px}

/* דף תרגול */
.hero{width:100%;max-height:420px;object-fit:contain;border-radius:var(--r);background:#fff;display:block;cursor:zoom-in}
.ph-wrap{display:flex;flex-direction:column;gap:8px}
.doc-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.doc-strip button{flex-shrink:0;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px;font-weight:600}
.doc-strip button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.ptitle{display:flex;flex-direction:column;gap:10px}
.ptitle h1{font-weight:800;font-size:26px;line-height:1.15}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:6px 12px;border-radius:14px;background:var(--soft);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
a.tag{color:var(--ink);min-height:44px;background:#fff;border:1px solid var(--line)}
.tag .dot{width:14px;height:6px;border-radius:3px}
.lead{margin:0;font-size:17px;line-height:1.5}
.box{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--card);border-radius:var(--r)}
.box h2{font-weight:700;font-size:17px;color:var(--brand)}
.box p{margin:0;font-size:16px;line-height:1.55;white-space:pre-line}
.box.warn{border-inline-start:4px solid #D98A2B}
.box.warn h2{color:#8A4E0B}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fact{display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--card);border-radius:14px}
.fact .k{font-size:13px;color:var(--ink2)}
.fact .v{font-family:Rubik,sans-serif;font-weight:700;font-size:16px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s;font-size:16px;line-height:1.5}
.steps li::before{content:counter(s);flex-shrink:0;width:32px;height:32px;border-radius:16px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Rubik,sans-serif;font-weight:700}
.pending{font-size:14px;color:var(--ink2);margin:0}
.byline{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink2);min-height:44px}
.player{display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 20px 22px;background:var(--brand);border-radius:20px;color:#fff}
.player .play{width:96px;height:96px;border:0;border-radius:48px;background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center}
.player .bar{width:100%;height:6px;border-radius:3px;background:#8A4FC0;cursor:pointer}
.player .bar i{display:block;height:6px;border-radius:3px;background:#fff;width:0}
.player .tm{width:100%;display:flex;justify-content:space-between;font-size:14px}

/* מצב הקרנה */
.show{position:fixed;inset:0;background:#fff;z-index:100;display:flex;align-items:center;gap:20px;padding:16px 20px;color:var(--ink)}
.show .nav{flex-shrink:0;width:56px;height:56px;border:1px solid var(--line);border-radius:28px;background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center}
.show .nav:disabled{opacity:.3;cursor:default}
.show .stage{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
.show .stage img{max-width:100%;max-height:100%;object-fit:contain}
.show .stage iframe{width:100%;height:100%;border:0}
.show .side{flex-shrink:0;align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.show .exit{min-height:44px;display:flex;align-items:center;padding:0 16px;border:1px solid var(--line);border-radius:22px;font-weight:700;font-size:15px;background:#fff;color:var(--brand)}
.show .spacer{height:44px}
.show .txt{max-width:1100px;display:flex;flex-direction:column;gap:3vh;text-align:center}
.show .txt h2{font-size:clamp(28px,5vw,64px);color:var(--brand);line-height:1.15}
.show .txt p{font-size:clamp(20px,3.2vw,40px);line-height:1.45;margin:0;white-space:pre-line}
.foot{font-size:14px;color:var(--ink2);border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.foot a{display:inline-flex;align-items:center;min-height:44px;font-weight:700}
.prose{display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.6;max-width:720px}
.prose h2{font-size:19px;color:var(--brand);margin-top:8px}
.prose p,.prose ul{margin:0}
.prose ul{padding-inline-start:22px}
.goal{margin:0;font-size:16px;line-height:1.5;color:var(--body)}
.box.read p{font-size:18px;line-height:1.75}
.show .txt{overflow-y:auto;max-height:100%;padding:2vh 0}
.show .txt p.long{font-size:clamp(18px,2.4vw,32px);line-height:1.6;text-align:right}
.show .ssteps{text-align:right;margin:0;padding-inline-start:1.4em;font-size:clamp(18px,2.4vw,32px);line-height:1.5;display:flex;flex-direction:column;gap:1.2vh}
.show .open{font-size:15px;font-weight:700}

/* התרגולים שלי וסימון "עשיתי" (4.10.2026) */
.mine-acts{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:var(--card);border-radius:var(--r)}
.mine-acts .row>.btn{flex:1 1 140px}
.mine-acts .st{font-size:15px;color:var(--ink2);margin:0}
.btn.ghost[aria-pressed="true"]{background:var(--brand);color:#fff}
.markTag{position:absolute;top:8px;left:8px;background:var(--brand);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px}
.card.text{position:relative}
.card.text .markTag{top:10px;left:10px}
.who{font-size:14px;color:var(--ink2);display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.who button{min-height:44px;border:0;background:none;color:var(--brand);font-weight:700;padding:0 4px;text-decoration:underline}
.foot{display:flex;flex-direction:column;gap:2px}
.foot .install{border:0;background:none;padding:0;color:var(--brand);font-weight:700;min-height:44px;text-align:start}

@media (min-width:720px){
  .cover-hero{flex-direction:row;align-items:center;justify-content:space-between;padding:22px 26px}
  .cover-hero .search{flex:0 1 440px}
  .duo{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:end}
  .today{flex-direction:row;max-width:none}
  .today img{width:48%;height:230px;flex-shrink:0}
  .today .in{justify-content:center;padding:20px}
  .today .t{font-size:22px}
  .doors{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .card .ph img{height:170px}
  .cover-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
}
@media (min-width:1000px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:600px){
  .show{padding:8px;gap:8px}
  .show .nav{width:44px;height:44px}
}
@media print{
  body{background:#fff}
  .wrap>*:not(.print-me){display:none !important}
  .print-me .hero{max-height:none;border-radius:0}
  .print-me>*:not(.hero){display:none !important}
}
/* ===== כריכה חדשה (4.10.2026): הפנקס כחפץ. כריכת בד סגולה, גומייה, דף שתחוב בפנים, ולשוניות חוצצים ===== */
.nb{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 24px;color:#fff;
  background:radial-gradient(120% 90% at 85% 0%,#7A2BB8 0%,rgba(122,43,184,0) 60%),linear-gradient(160deg,#5B0C99 0%,#3B0566 100%);
  box-shadow:0 18px 40px -18px rgba(59,5,102,.55);display:flex;flex-direction:column;gap:22px}
.nb::before{content:"";position:absolute;inset:10px;border:1.5px dashed rgba(255,255,255,.22);border-radius:19px;pointer-events:none}
.nb-band{position:absolute;top:0;bottom:0;left:38px;width:14px;background:linear-gradient(90deg,#B8860B,#F2C14E 45%,#C9971A);box-shadow:2px 0 6px rgba(0,0,0,.25);opacity:.95}
.nb-feathers{position:absolute;inset:0;pointer-events:none}
.nb-feathers svg{position:absolute;fill:rgba(255,255,255,.17);animation:drift var(--dur,16s) ease-in-out infinite alternate}
@keyframes drift{from{transform:translateY(0) rotate(var(--r0,-12deg))}to{transform:translateY(-26px) rotate(var(--r1,10deg))}}
.nb-main{position:relative;display:flex;flex-direction:column;gap:12px;padding-inline-end:44px}
.nb-top{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:#E9DFF3}
.nb-top img{width:44px;height:44px;border-radius:12px;background:#fff;object-fit:cover}
.nb h1{font-weight:800;font-size:44px;line-height:.98;letter-spacing:-.5px;color:#fff}
.nb h1 em{font-style:normal;color:#F2C14E}
.nb-sub{margin:0;font-size:17px;color:#E9DFF3}
.nb .search{max-width:none;color:#E9DFF3}
.nb .search input{border:0;height:52px;border-radius:26px;padding:0 20px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.nb .search button{height:52px;border-radius:26px;background:#F2C14E;color:#2B1245;padding:0 20px}
.nb-acts{display:flex;flex-wrap:wrap;gap:10px}
.nb-acts .btn{flex:0 1 auto;min-height:48px;border-radius:24px;font-size:16px}
.btn.gold{background:#F2C14E;color:#2B1245}
.btn.gold:hover{background:#FFD36B;color:#2B1245}
.btn.onpurple{background:transparent;border:2px solid rgba(255,255,255,.7);color:#fff}
.btn.onpurple:hover{background:rgba(255,255,255,.12);color:#fff}
.nb-count{font-size:14px;color:#D9C8EC}
/* הדף שתחוב בתוך הכריכה: התרגול של היום */
.nb-page{position:relative;align-self:center;width:min(100%,330px);background:#FFFDF7;color:var(--ink);border-radius:6px 6px 14px 14px;padding:14px 14px 16px;
  transform:rotate(-2.5deg);box-shadow:0 14px 30px -10px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px;transition:transform .25s}
.nb-page:hover,.nb-page:focus-visible{transform:rotate(0) translateY(-4px);color:var(--ink)}
.nb-page::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 27px,rgba(84,7,143,.07) 27px 28px)}
.nb-page .clip{position:absolute;top:-14px;right:28px;width:22px;height:44px;border:3px solid #B9A8CC;border-radius:11px;border-bottom-color:transparent}
.nb-page .lbl{align-self:flex-start;font-family:Rubik,sans-serif;font-weight:700;font-size:13px;color:#fff;background:var(--brand);padding:3px 10px;border-radius:10px}
.nb-page img{width:100%;height:170px;object-fit:cover;object-position:top;border-radius:8px;background:#fff;border:1px solid #EEE8F4}
.nb-page .t{font-family:Rubik,sans-serif;font-weight:700;font-size:19px;line-height:1.2}
.nb-page .m{font-size:14px;color:var(--ink2)}
/* סרט סימנייה: עכשיו במהלך */
.season2{position:relative;background:var(--card);border-radius:var(--r);padding:16px 16px 14px 16px;padding-inline-start:52px;display:flex;flex-direction:column;gap:10px}
.season2::before{content:"";position:absolute;top:0;right:16px;width:22px;height:46px;background:#D9A51C;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.season2 h2{font-size:18px}
.season2 .k{font-size:13px;font-weight:700;color:#8A6408;letter-spacing:.3px}
/* לשוניות חוצצים */
.tabs{display:flex;gap:4px;align-items:flex-end;padding-inline-start:10px;margin-bottom:-1px;position:relative;z-index:1}
.tabs button{min-height:46px;border:0;border-radius:14px 14px 0 0;padding:0 16px;font-weight:700;font-size:15px;background:#E2D4EF;color:var(--ink2);transform:translateY(5px);transition:transform .15s,background .15s}
.tabs button:nth-child(2){background:#EADFC4}
.tabs button:nth-child(3){background:#D5E6E2}
.tabs button:hover{transform:translateY(2px)}
.tabs button[aria-pressed="true"]{background:#fff;color:var(--brand);transform:none;box-shadow:0 -3px 10px -4px rgba(59,5,102,.25)}
.tabpanel{background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 28px -18px rgba(59,5,102,.4)}
/* אריחים צבעוניים לחלקים ולדלתות */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{--c:#54078F;position:relative;display:flex;flex-direction:column;gap:6px;padding:14px;min-height:118px;border-radius:16px;overflow:hidden;color:var(--ink);
  background:#F4EEF9;background:color-mix(in srgb,var(--c) 13%,#fff);border-bottom:5px solid var(--c);transition:transform .18s,box-shadow .18s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);box-shadow:0 10px 20px -12px var(--c);color:var(--ink)}
.tile .big{font-family:Rubik,sans-serif;font-weight:800;font-size:34px;line-height:1;color:var(--c);color:color-mix(in srgb,var(--c) 68%,#2B1245)}
.tile .t{font-family:Rubik,sans-serif;font-weight:700;font-size:16px;line-height:1.2}
.tile .n{font-size:13px;color:var(--ink2)}
.tile.empty{opacity:.55}
.tile .fan{position:absolute;left:10px;top:10px;width:62px;height:56px}
.tile .fan img{position:absolute;bottom:0;left:0;width:40px;height:50px;object-fit:cover;object-position:top;border-radius:5px;background:#fff;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.18);transform-origin:bottom center}
.tile .fan img:nth-child(1){transform:rotate(-14deg)}
.tile .fan img:nth-child(2){left:10px;transform:rotate(-2deg)}
.tile .fan img:nth-child(3){left:20px;transform:rotate(11deg)}
.tile.withfan .big{height:56px}
.bg-wrap{display:flex;flex-direction:column;gap:14px}
/* סינון קומפקטי */
.filters{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:var(--r);padding:14px 16px}
.filters .fr{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.filters .fl{font-family:Rubik,sans-serif;font-weight:700;font-size:15px;min-width:76px;color:var(--brand)}
@media (min-width:720px){
  .nb{flex-direction:row;align-items:center;justify-content:space-between;padding:36px 40px 36px 90px;gap:30px;min-height:380px}
  .nb-band{left:46px;width:16px}
  .nb-main{flex:1 1 auto;max-width:520px;padding:0}
  .nb h1{font-size:64px}
  .nb-page{flex:0 0 300px;transform:rotate(3deg)}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bg-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start;gap:18px}
  .bg-wrap .poster{position:sticky;top:12px}
  .bg-wrap .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabs button{padding:0 26px;font-size:16px}
  .tabpanel{padding:20px}
}
@media (prefers-reduced-motion:reduce){.nb-feathers svg{animation:none}.nb-page,.tile{transform:none !important}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<a class="skip" href="#main" id="skip">דילוג לתוכן</a>
<div id="app"></div>
<noscript><p style="padding:16px">כדי לדפדף בפנקס צריך להפעיל JavaScript בדפדפן.</p></noscript>
<script src="data-v2.js"></script>
<script>
"use strict";
/* פנקס התרגולים של סביון, שלב 1: קריאה והקרנה בלבד.
   הנתונים ב-data-v2.js (נבנה ב-build_v2.py). התוספות של צוות השפה
   הקשובה נמשכות בכל טעינה, לקריאה בלבד. אין כאן עריכה, גיבוי או שחזור. */

const D = window.PINKAS;
const TYPES = [
  {id:'page', label:'דף להקרנה'},
  {id:'audio', label:'הקלטה לשמיעה'},
  {id:'write', label:'תרגול כתוב'},
  {id:'activity', label:'פעילות'},
  {id:'deck', label:'מצגת'},
];
const TYPE_LABEL = Object.fromEntries(TYPES.map(t=>[t.id,t.label]));
const MODES = [
  {id:'class', label:'לכיתה'},
  {id:'student', label:'לתלמיד אחד'},
  {id:'me', label:'בשבילי'},
];
/* אתר ההוספה והאישור (שלב 2): כל איש צוות מעלה, וצוות מוביל השפה הקשובה מאשר */
const ADD_URL = "https://script.google.com/macros/s/AKfycbwwr4eOX9jFACxB_nyTfk0k-wOOCTKozJE6SIRFRFNjcOZdcvSDWVX5QdmFerebVixoeg/exec";
const ADDS_URL = "https://script.google.com/macros/s/AKfycbwwr4eOX9jFACxB_nyTfk0k-wOOCTKozJE6SIRFRFNjcOZdcvSDWVX5QdmFerebVixoeg/exec?api=additions";
const ICON_BACK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const ICON_FWD = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
const ICON_PREV = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const ICON_PLAY = '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';

const doorOf = n => D.doors.find(d=>d.n===n);
const topicOf = id => D.topics.find(t=>t.id===id);
/* תרגול שייך לנושא שלו, ויכול להופיע גם בנושאים נוספים (also), בלי לזוז מהבית שלו */
const inTopic = (p, id) => p.topic===id || (p.also||[]).includes(id);
const byId = id => D.practices.find(p=>p.id===id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- העדפות קטנות של הצופה (רק נוחות, לא נתונים) ---------- */
const PREF_KEY = 'pinkasV2Prefs';
let PREF = {type:'all', by:'boger', time:'all'};
try{ Object.assign(PREF, JSON.parse(localStorage.getItem(PREF_KEY)||'{}')); }catch(e){}
if(['me','boger','topics'].indexOf(PREF.by)<0) PREF.by='boger';
/* כמה זמן יש (4.10.2026): הסינון לפי הגבול העליון של הטווח, "10–15" נחשב 15 */
const TIMES = [{id:'all', label:'כל זמן'}, {id:'5', label:'עד 5 דק׳'}, {id:'10', label:'עד 10 דק׳'}, {id:'20', label:'עד 20 דק׳'}];
if(!TIMES.some(t=>t.id===PREF.time)) PREF.time='all';
function minsOf(p){
  const n = String(p.minutes||'').match(/\d+/g);
  if(n) return Math.max(...n.map(Number));
  return p.staffMin || null;
}
function minsLabel(p){
  if(p.minutes) return p.minutes+' דק׳';
  return p.staffMin ? 'כ-'+p.staffMin+' דק׳' : '';
}
function fitsTime(p, time){ time = time||PREF.time; if(time==='all') return true; const m=minsOf(p); return m!=null && m<=+time; }
/* "בשבילי" הוא תרגולי הצוות; בשתי הדרכים האחרות מוצג כל מה שאינו לצוות בלבד */
function curMode(){ return PREF.by==='me' ? 'me' : 'class'; }
function savePref(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(PREF)); }catch(e){} }

/* ---------- סינון ---------- */
function isStaffOnly(p){ return (p.houses||[]).length===1 && p.houses[0]==='צוות' && !(p.audience||[]).includes('class'); }
function inMode(p, mode){
  mode = mode||curMode();
  if(mode==='me') return (p.audience||[]).includes('staff') || (p.houses||[]).includes('צוות');
  if(isStaffOnly(p)) return false;
  if(mode==='student') return !( (p.audience||[]).length && !p.audience.includes('student') && p.audience.includes('staff') );
  return !((p.audience||[]).length && !p.audience.includes('class'));
}
/* תרגול רגיש (עדן, 2.10.2026): יש לו "שימו לב" או סימון. לא בהגרלה, וההקרנה לא עוברת אליו בחיצים */
function isSensitive(p){ return !!(p.note || p.sensitive); }
function visible(p, type){ type = type||PREF.type; return inMode(p) && (type==='all' || p.type===type) && fitsTime(p); }
/* סדרה לבית אחד ולפי דרישה (מסע הקברניט, צעירים): נשארת בנושא, אבל בסוף הרשימה ולא בכריכה */
function sortForMode(list){
  list = list.slice().sort((a,b)=>(a.onDemand?1:0)-(b.onDemand?1:0));
  if(curMode()!=='student') return list;
  return list.slice().sort((a,b)=>((b.audience||[]).includes('student')?1:0)-((a.audience||[]).includes('student')?1:0));
}

/* ---------- זרע יומי: התרגול של היום והכנפיים המסתתרות ---------- */
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

/* ---------- ניתוב ---------- */
function parseHash(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/,''));
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const q = new URLSearchParams(qs||'');
  return {parts, q};
}
const app = document.getElementById('app');
let SHOW = null;  /* מצב הקרנה פעיל */

function render(){
  const {parts, q} = parseHash();
  stopAudio();
  const act = document.activeElement;
  const keepQ = act && act.id==='q' ? {v:act.value, s:act.selectionStart} : null;
  if(parts[0]==='show' && byId(parts[1])) return renderShow(byId(parts[1]), q);
  closeShowDom();
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  if(parts[0]==='door' && doorOf(+parts[1])) renderDoor(+parts[1], q.get('t')||'');
  else if(parts[0]==='p' && byId(parts[1])) renderPractice(byId(parts[1]));
  else if(parts[0]==='search') renderSearch(q.get('q')||'');
  else if(parts[0]==='topic' && topicOf(parts[1])) renderTopic(parts[1]);
  else if(parts[0]==='step' && STEPS[(+parts[1]||0)-1]) renderStep(+parts[1]);
  else if(parts[0]==='boger' && /^[1-6]$/.test(parts[1]||'')) renderBoger(+parts[1], q.get('i')||'');
  else if(parts[0]==='negishut') renderA11y();
  else if(parts[0]==='mine') renderMine();
  else renderCover();
  placeHiddenWings(parts[0]||'cover');
  if(keepQ){ const i=document.getElementById('q'); if(i){ i.value=keepQ.v; i.focus(); try{i.setSelectionRange(keepQ.s,keepQ.s);}catch(e){} } }
}
let lastRoute = '';
function onRoute(){
  const r = location.hash;
  render();
  const routeBase = r.replace(/\?.*$/,'');
  if(routeBase!==lastRoute && !/^#\/?show\//.test(r)){
    window.scrollTo(0,0);
    const h = app.querySelector('h1'); if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
  }
  lastRoute = routeBase;
}
window.addEventListener('hashchange', onRoute);
function go(h){ if(location.hash===h) render(); else location.hash = h; }

/* ---------- רכיבים ---------- */
function homeWing(){ return `<a class="homewing" href="#/" aria-label="חזרה לכריכה"><img src="wings-hi.png" alt=""></a>`; }
function backLink(href, label){ return `<a class="back" href="${href}">${ICON_BACK}<span>${esc(label)}</span></a>`; }
function imgSrc(p){ return p.img || (p.docs&&p.docs[0]&&p.docs[0].img) || ''; }
function houseLabel(p){ return p.layer || ''; }

function cardHtml(p){
  const door = doorOf(p.door);
  const src = imgSrc(p);
  if(src){
    const badge = p.type==='deck' ? 'מצגת' : (p.docs&&p.docs.length>1 ? p.docs.length+' דפים' : '');
    return `<a class="card" href="#/p/${esc(p.id)}">
      <span class="ph"><img loading="lazy" decoding="async" src="${esc(src)}" alt="" onerror="this.style.visibility='hidden'">${badge?`<span class="badge">${badge}</span>`:''}${markTag(p)}</span>
      <span class="tt">${esc(p.title)}</span>${p.note?`<span class="warnTag">שימו לב</span>`:''}</a>`;
  }
  return `<a class="card text" href="#/p/${esc(p.id)}">${markTag(p)}
    <span class="top"><span class="dot" style="background:${door.color}"></span>${esc(TYPE_LABEL[p.type])}${minsLabel(p)?` · ${esc(minsLabel(p))}`:''}</span>
    <span class="tt">${esc(p.title)}</span>
    <span class="w">${esc(p.what)}</span>
    ${houseLabel(p)?`<span class="lay">${esc(houseLabel(p))}</span>`:''}${p.note?`<span class="warnTag">שימו לב</span>`:''}</a>`;
}
function filterLine(){
  const bits = [];
  if(PREF.type!=='all') bits.push('רק '+TYPE_LABEL[PREF.type]);
  if(PREF.time!=='all') bits.push('עד '+PREF.time+' דק׳');
  if(PREF.by==='me') bits.push('בשבילי');
  if(!bits.length) return '';
  const unk = PREF.time!=='all' ? ' (תרגול שזמנו לא ידוע אינו מוצג)' : '';
  return `<div class="filt"><span>מוצג: ${esc(bits.join(' · '))}${unk}</span><button type="button" data-act="clear">להציג הכול</button></div>`;
}

/* ---------- כריכה ---------- */
function renderCover(){
  const vis = D.practices.filter(p=>visible(p));
  const inM = D.practices.filter(p=>inMode(p));
  const typeCounts = Object.fromEntries(TYPES.map(t=>[t.id, inM.filter(p=>p.type===t.id).length]));
  const pool = inM.filter(p=>imgSrc(p) && p.type==='page' && !isSensitive(p) && !p.onDemand);
  const todayPool = pool.length ? pool : inM;
  const today = todayPool.length ? todayPool[hash(todayKey()+curMode())%todayPool.length] : null;
  const now = new Date(), hr = now.getHours();
  const hello = hr<5?'לילה טוב':hr<12?'בוקר טוב':hr<17?'צהריים טובים':hr<21?'ערב טוב':'לילה טוב';
  const day = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'][now.getDay()];
  app.innerHTML = `<main class="wrap" id="main">
    <header class="nb">
      ${coverFeathers()}
      <span class="nb-band" aria-hidden="true"></span>
      <div class="nb-main">
        <div class="nb-top"><img src="logo-hi.png" alt="סמל בית ספר סביון"><span>${hello} · יום ${day}</span></div>
        <h1>פנקס<br><em>התרגולים</em></h1>
        <p class="nb-sub">בית ספר סביון · מצמיח לך כנפיים</p>
        <div class="search"><label for="q" class="hint" style="color:inherit">מה מחפשים היום?</label>
          <form data-act="search" role="search"><input id="q" type="search" placeholder="למשל: רמזור, נשימה, כעס" autocomplete="off" enterkeyhint="search"><button type="submit">חיפוש</button></form></div>
        <div class="nb-acts">
          <button type="button" class="btn gold" data-act="surprise" title="תרגול נוכחות קצר, בהגרלה">הנני כאן</button>
          <a class="btn onpurple" href="${ADD_URL}" target="_blank" rel="noopener">הוספת תרגול</a>
        </div>
        <div class="nb-count">${inM.length} תרגולים בפנקס</div>
      </div>
      ${today?`<a class="nb-page" href="#/p/${esc(today.id)}"><span class="clip" aria-hidden="true"></span><span class="lbl">התרגול של היום</span>
        ${imgSrc(today)?`<img src="${esc(imgSrc(today))}" alt="">`:''}
        <span class="t">${esc(today.title)}</span><span class="m">${esc(doorOf(today.door).title)} · ${esc(TYPE_LABEL[today.type])}${minsLabel(today)?' · '+esc(minsLabel(today)):''}</span></a>`:''}
    </header>
    ${weeklyHtml()}${seasonHtml()}
    <section class="sect" aria-labelledby="h-doors">
      <h2 id="h-doors">מה צריך עכשיו?</h2>
      <div>
        <div class="tabs" role="group" aria-label="איך מחפשים">
          ${[['boger','לפי בוגר סביון'],['topics','לפי נושא'],['me','בשבילי']].map(b=>`<button type="button" data-by="${b[0]}" aria-pressed="${PREF.by===b[0]}">${b[1]}</button>`).join('')}
        </div>
        <div class="tabpanel">${coverBrowse(vis)}</div>
      </div>
    </section>
    <section class="sect" aria-labelledby="h-filt">
      <h2 id="h-filt">לצמצם את הבחירה</h2>
      <div class="filters">
        <div class="fr"><span class="fl">באיזו צורה</span>
          <button type="button" class="chip" data-type="all" aria-pressed="${PREF.type==='all'}">הכול</button>
          ${TYPES.filter(t=>typeCounts[t.id] || t.id==='audio').map(t=>typeCounts[t.id]
            ? `<button type="button" class="chip" data-type="${t.id}" aria-pressed="${PREF.type===t.id}">${t.label} <span class="c">${typeCounts[t.id]}</span></button>`
            : `<span class="chip soon" aria-disabled="true">${t.label} <span class="c">בקרוב</span></span>`).join('')}
        </div>
        <div class="fr"><span class="fl">כמה זמן יש</span>
          ${TIMES.map(t=>{ const n = t.id==='all' ? '' : inM.filter(p=>(PREF.type==='all'||p.type===PREF.type) && fitsTime(p,t.id)).length;
            return `<button type="button" class="chip" data-time="${t.id}" aria-pressed="${PREF.time===t.id}">${t.label}${n!==''?` <span class="c">${n}</span>`:''}</button>`; }).join('')}
        </div>
      </div>
    </section>

function coverFeathers(){
  const F = '<path d="M20 2C35 24 37 64 22 104l-2 14-2-14C3 64 5 24 20 2z"/>';
  let out = '';
  for(let i=0;i<7;i++){
    const h = hash(todayKey()+'f'+i);
    const x = 4 + h%88, y = 4 + (h>>7)%80, w = 16 + (h>>13)%22;
    const r0 = ((h>>3)%60)-30, r1 = r0 + 14 + (h>>9)%18, dur = 11 + (h>>5)%10;
    out += `<svg viewBox="0 0 40 120" style="left:${x}%;top:${y}%;width:${w}px;--r0:${r0}deg;--r1:${r1}deg;--dur:${dur}s">${F}</svg>`;
  }
  return `<div class="nb-feathers" aria-hidden="true">${out}</div>`;

function seasonHtml(){
  const m = new Date().getMonth() + 1;

  if(now.length) return `<section class="season2" aria-labelledby="h-season"><span class="k">עכשיו במהלך השנתי</span><h2 id="h-season">${esc(MONTH_NAME[m])}</h2>

}

function norm(s){ return String(s||'').replace(/[֑-ׇ"'׳״]/g,'').toLowerCase(); }

function fullHtml(p){
  const F = p.full || {}, out = [];
  if(F.goal) out.push(`<p class="goal"><b>המטרה:</b> ${esc(F.goal)}</p>`);
  /* החומרים של הנושא נכנסים לדף התרגול עצמו, ולא רק לדף הנושא: מה שהתרגול מזכיר ב"מה להכין" עולה ראשון */
  const t = topicOf(p.topic), mats = (p.materials && p.materials.length ? p.materials : (t && t.materials) || []);
  const base = m => m.name.replace(/\s*\(.*\)\s*$/,'').trim();
  const named = mats.filter(m=>F.prep && F.prep.includes(base(m)));
  const ordered = named.concat(mats.filter(m=>!named.includes(m)));
  const matsHtml = ordered.length ? `<div class="mats"><b>${F.prep?'לפתיחה:':'מהחומרים הסגולים:'}</b>${ordered.map(m=>`<a class="chip" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.name)}</a>`).join('')}</div>` : '';
  if(F.prep) out.push(`<div class="box"><h2>מה להכין</h2><p>${esc(F.prep)}</p>${matsHtml}</div>`);
  else if(matsHtml) out.push(`<div class="box"><h2>החומרים של הנושא</h2>${matsHtml}</div>`);
  if(F.steps && F.steps.length) out.push(`<div class="box"><h2>${p.type==='activity'?'איך עושים':'שלב אחרי שלב'}</h2><ol class="steps">${F.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`);
  if(F.text) out.push(`<div class="box read"><h2>${p.type==='audio'?'רוצה להנחות בקול שלך?':'הטקסט להקראה'}</h2><p>${esc(F.text)}</p></div>`);
  if(F.questions) out.push(`<div class="box"><h2>שאלות לשיחה</h2><p>${esc(F.questions)}</p></div>`);
  if(F.closing) out.push(`<div class="box"><h2>לסיום</h2><p>${esc(F.closing)}</p></div>`);
  if(F.tip) out.push(`<div class="box"><h2>טיפ למנחה</h2><p>${esc(F.tip)}</p></div>`);
  return out.join('');
}
function fileUrl(f){ return /^https?:/.test(f) ? f : '../'+f.split('/').map(encodeURIComponent).join('/'); }
function embedUrl(f){ return /^https?:/.test(f) ? f.replace(/\/view(\?.*)?$/,'/preview') : fileUrl(f)+'#view=FitH'; }

/* ---------- הקלטה ---------- */
let AUDIO = null;
function fmt(s){ s=Math.max(0,Math.floor(s||0)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function wireAudio(p){
  AUDIO = new Audio(); AUDIO.preload='none'; AUDIO.src = p.audio;
  const btn = app.querySelector('[data-act=play]'), bar = app.querySelector('.player .bar'), fill = bar.querySelector('i');
  AUDIO.addEventListener('play',()=>{ document.body.classList.add('playing'); btn.innerHTML=ICON_PAUSE; btn.setAttribute('aria-label','השהיית ההקלטה'); });
  AUDIO.addEventListener('pause',()=>{ document.body.classList.remove('playing'); btn.innerHTML=ICON_PLAY; btn.setAttribute('aria-label','הפעלת ההקלטה'); });
  AUDIO.addEventListener('loadedmetadata',()=>{ document.getElementById('tAll').textContent = fmt(AUDIO.duration); });
  AUDIO.addEventListener('timeupdate',()=>{ const pc = AUDIO.duration? AUDIO.currentTime/AUDIO.duration*100 : 0;
    fill.style.width=pc+'%'; bar.setAttribute('aria-valuenow',Math.round(pc)); document.getElementById('tNow').textContent=fmt(AUDIO.currentTime); });
  bar.addEventListener('click',e=>{ if(!AUDIO.duration) return; const r=bar.getBoundingClientRect(); AUDIO.currentTime = (r.right-e.clientX)/r.width*AUDIO.duration; });
  bar.addEventListener('keydown',e=>{ if(!AUDIO.duration) return; if(e.key==='ArrowLeft'){AUDIO.currentTime+=10;e.preventDefault();} if(e.key==='ArrowRight'){AUDIO.currentTime-=10;e.preventDefault();} });
}
function stopAudio(){ if(AUDIO){ AUDIO.pause(); AUDIO=null; } document.body.classList.remove('playing'); }

/* ---------- כנפיים מסתתרות: מקום אחר בכל יום, לא בכל כניסה ---------- */
function placeHiddenWings(screen){
  const main = app.querySelector('main'); if(!main) return;
  const kids = [...main.children].filter(el=>!el.classList.contains('homewing') && !el.classList.contains('back'));
  if(kids.length<2) return;
  const h = hash(todayKey()+'|'+screen);
  const at = 1 + (h % (kids.length-1));
  const side = (h>>4)%2 ? 'flex-start' : 'flex-end';
  const rot = ((h>>6)%36) - 18;
  const row = document.createElement('div');
  row.className='hiderow'; row.style.justifyContent=side;
  row.innerHTML = `<a class="hidewing" href="#" data-act="surprise" aria-label="הנני כאן: תרגול נוכחות קצר בהגרלה"><img src="wings-hi.png" alt="" style="transform:rotate(${rot}deg)"></a>`;
  main.insertBefore(row, kids[at]);
}
/* "הנני כאן" (הכרעת שחף, 2.10.2026): ההגרלה מביאה רק תרגול נוכחות קצר, ואף פעם לא תרגול רגיש.
   הרשימה נקבעת ב-build_v2.py (השדה short) ומתועדת ב-שינויים-לבדיקת-חן.md */
function surprise(){
  const cur = parseHash();
  const base = D.practices.filter(p=>p.short && !isSensitive(p) && !p.onDemand);
  const pool = base.filter(p=>inMode(p) && !(cur.parts[0]==='p' && cur.parts[1]===p.id));
  const list = pool.length ? pool : base;
  go('#/p/'+list[Math.floor(Math.random()*list.length)].id);
}

/* ---------- מצב הקרנה ---------- */
function showList(p){ return siblings(p).filter(x=>x.id===p.id || (!isSensitive(x) && !x.noShow)); }
function renderShow(p, q){
  const doc = Math.max(0, +(q.get('d')||0));
  const docs = p.docs && p.docs.length ? p.docs : null;
  const list = showList(p);
  const i = list.findIndex(x=>x.id===p.id);
  const hasPrev = doc>0 || i>0, hasNext = (docs && doc<docs.length-1) || (i>=0 && i<list.length-1);
  let stage = '', isPdf = '';
  const cur = docs ? docs[Math.min(doc,docs.length-1)] : p;
  if(p.type==='deck' || (docs && cur.kind==='מצגת')){
    const f = cur.file || p.file; isPdf = f;
    stage = f ? `<iframe src="${esc(embedUrl(f))}" title="${esc(p.title)}" allowfullscreen></iframe>` : `<img src="${esc(cur.img||imgSrc(p))}" alt="${esc(p.title)}">`;
  } else if(imgSrc(p)){
    stage = `<img src="${esc(cur.img||imgSrc(p))}" alt="${esc(p.title)}">`;
  } else {
    const F=p.full||{};
    const inner = F.text ? `<p class="long">${esc(F.text)}</p>`
      : (F.steps&&F.steps.length) ? `<ol class="ssteps">${F.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`
      : `<p>${esc(p.what)}</p>`;
    stage = `<div class="txt"><h2>${esc(p.title)}</h2>${inner}</div>`;
  }
  closeShowDom();
  const el = document.createElement('div');
  el.className='show'; el.id='show'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label','מצב הקרנה: '+p.title);
  el.innerHTML = `<button type="button" class="nav" data-act="prev" aria-label="הקודם" ${hasPrev?'':'disabled'}>${ICON_PREV}</button>
    <div class="stage">${stage}</div>
    <div class="side"><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><button type="button" class="exit" data-act="exit">יציאה</button>
      ${isPdf?`<a class="open" href="${esc(fileUrl(isPdf))}" target="_blank" rel="noopener">בלשונית</a>`:''}</div>
      <button type="button" class="nav" data-act="next" aria-label="הבא" ${hasNext?'':'disabled'}>${ICON_FWD}</button><span class="spacer"></span></div>`;
  document.body.appendChild(el);
  document.body.style.overflow='hidden';
  SHOW = {p, doc, docs, list, i};
  el.querySelector('[data-act=exit]').focus({preventScroll:true});
}
function closeShowDom(){ const s=document.getElementById('show'); if(s){ s.remove(); document.body.style.overflow=''; } SHOW=null; }
function showStep(dir){
  if(!SHOW) return;
  const {p, doc, docs, list, i} = SHOW;
  if(docs && doc+dir>=0 && doc+dir<docs.length) return location.replace('#/show/'+p.id+'?d='+(doc+dir));
  const n = list[i+dir]; if(!n) return;
  const d = dir<0 && n.docs && n.docs.length ? n.docs.length-1 : 0;
  location.replace('#/show/'+n.id+(d?'?d='+d:''));
}
function exitShow(){
  const id = SHOW && SHOW.p.id;
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  closeShowDom();
  location.replace('#/p/'+(id||''));
}
function enterShow(id){
  const el = document.documentElement;
  if(el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(()=>{});
  track('show', byId(id));
  go('#/show/'+id);
}
/* יציאה ממסך מלא (Esc של הדפדפן) מוציאה גם ממצב ההקרנה */
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && SHOW) exitShow(); });

/* ---------- אירועים ---------- */
app.addEventListener('click', e=>{
  const by = e.target.closest('[data-by]'); if(by){ PREF.by=by.dataset.by; savePref(); render(); return; }
  const t = e.target.closest('[data-type]'); if(t){ PREF.type=t.dataset.type; savePref(); render(); return; }
  const tm = e.target.closest('[data-time]'); if(tm){ PREF.time=tm.dataset.time; savePref(); render(); return; }
  const dbtn = e.target.closest('[data-doc]');
  if(dbtn){ const p=byId(app.querySelector('main').dataset.id); const d=p.docs[+dbtn.dataset.doc];
    const hero=document.getElementById('hero'); if(hero&&d.img) hero.src=d.img;
    app.querySelectorAll('[data-doc]').forEach(b=>b.setAttribute('aria-pressed', b===dbtn)); return; }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act;
  if(act==='surprise'){ e.preventDefault(); surprise(); }
  else if(act==='clear'){ PREF.type='all'; PREF.by='boger'; PREF.time='all'; savePref(); render(); }
  else if(act==='save'){ toggleSave(app.querySelector('main').dataset.id); }
  else if(act==='did'){ const box=document.getElementById('didAsk'); if(box){ box.hidden=false; const f=box.querySelector('button'); if(f) f.focus(); } }
  else if(act==='didMin'){ markDid(app.querySelector('main').dataset.id, +a.dataset.m||0); }
  else if(act==='forget'){ forgetUser(); }
  else if(act==='install'){ doInstall(); }
  else if(act==='show'){ const id=app.querySelector('main').dataset.id; if(!id) return;
    /* בטלפון אין תצוגת PDF בתוך הדף: המצגת נפתחת בלשונית משלה */
    const p=byId(id), f=p && p.type==='deck' && (p.file || (p.docs&&p.docs[0]&&p.docs[0].file));
    if(f && matchMedia('(pointer:coarse)').matches){ window.open(fileUrl(f),'_blank','noopener'); return; }
    enterShow(id); }
  else if(act==='print'){ window.print(); }
  else if(act==='play' && AUDIO){ AUDIO.paused ? AUDIO.play().catch(()=>{}) : AUDIO.pause(); }
});
app.addEventListener('submit', e=>{
  e.preventDefault();
  const v = (document.getElementById('q').value||'').trim();
  go('#/search?q='+encodeURIComponent(v));
});
document.addEventListener('click', e=>{
  if(!SHOW) return;
  const a = e.target.closest('#show [data-act]'); if(!a) return;
  if(a.dataset.act==='exit') exitShow();
  if(a.dataset.act==='prev') showStep(-1);
  if(a.dataset.act==='next') showStep(1);
});
document.addEventListener('keydown', e=>{
  if(!SHOW) return;
  if(e.key==='Tab'){
    const f=[...document.querySelectorAll('#show button:not([disabled]), #show a[href], #show iframe')];
    if(!f.length) return;
    const i=f.indexOf(document.activeElement);
    if(e.shiftKey && i<=0){ e.preventDefault(); f[f.length-1].focus(); }
    else if(!e.shiftKey && (i===-1 || i===f.length-1)){ e.preventDefault(); f[0].focus(); }
    return;
  }
  if(e.key==='Escape'){ e.preventDefault(); exitShow(); }
  else if(e.key==='ArrowLeft' || e.key==='PageDown' || (e.key===' ' && e.target.tagName!=='BUTTON')){ e.preventDefault(); showStep(1); }
  else if(e.key==='ArrowRight' || e.key==='PageUp'){ e.preventDefault(); showStep(-1); }
});
document.getElementById('skip').addEventListener('click', e=>{
  e.preventDefault(); const m=document.getElementById('main'); if(m){ m.setAttribute('tabindex','-1'); m.focus(); }
});

/* ---------- התרגולים שלי (4.10.2026): שמירה וסימון "עשיתי", בדפדפן הזה ---------- */
const MINE_KEY = 'pinkasV2Mine';
let MINE = {saved:{}, used:{}};
try{ Object.assign(MINE, JSON.parse(localStorage.getItem(MINE_KEY)||'{}')); }catch(e){}
function saveMine(){ try{ localStorage.setItem(MINE_KEY, JSON.stringify(MINE)); }catch(e){} }
function heDate(ts){ const d=new Date(ts); return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear(); }
function markTag(p){
  if(MINE.saved[p.id]) return `<span class="markTag" aria-label="שמור אצלי">★</span>`;
  if(MINE.used[p.id]) return `<span class="markTag" aria-label="עשיתי">✓</span>`;
  return '';
}
function mineActsHtml(p){
  const s = !!MINE.saved[p.id], u = MINE.used[p.id];
  return `<section class="mine-acts" aria-label="התרגולים שלי">
    <div class="row">
      <button type="button" class="btn ghost" data-act="save" aria-pressed="${s}">${s?'★ שמור בתרגולים שלי':'☆ לשמור בתרגולים שלי'}</button>
      <button type="button" class="btn ghost" data-act="did">✓ עשיתי את זה</button>
    </div>
    <div id="didAsk" hidden><p class="st">כמה זמן זה לקח בפועל?</p>
      <div class="chips">${[5,10,15,20,30].map(m=>`<button type="button" class="chip" data-act="didMin" data-m="${m}">${m} דק׳</button>`).join('')}<button type="button" class="chip" data-act="didMin" data-m="0">לא מדדתי</button></div></div>
    ${u?`<p class="st" role="status">עשית את זה ${u.n===1?'פעם אחת':u.n+' פעמים'}, לאחרונה ב-${heDate(u.last)}.</p>`:''}
  </section>`;
}
function toggleSave(id){
  const p = byId(id); if(!p) return;
  if(MINE.saved[id]) delete MINE.saved[id];
  else { MINE.saved[id] = Date.now(); track('save', p); }
  saveMine(); render();
}
function markDid(id, m){
  const p = byId(id); if(!p) return;
  const u = MINE.used[id] || {n:0, last:0};
  MINE.used[id] = {n:u.n+1, last:Date.now()};
  saveMine(); track('used', p, m, true); render();
}
function minePractices(){
  const saved = Object.keys(MINE.saved).map(byId).filter(Boolean).sort((a,b)=>MINE.saved[b.id]-MINE.saved[a.id]);
  const used = Object.keys(MINE.used).map(byId).filter(Boolean).sort((a,b)=>MINE.used[b.id].last-MINE.used[a.id].last);
  return {saved, used};
}
function mineCoverHtml(){
  const {saved, used} = minePractices();
  if(!saved.length && !used.length) return '';
  const pick = [...saved, ...used.filter(p=>!MINE.saved[p.id])].slice(0,4);
  return `<section class="sect" aria-labelledby="h-mine">
    <h2 id="h-mine">התרגולים שלי</h2>
    <div class="grid">${pick.map(cardHtml).join('')}</div>
    <a class="back" href="#/mine">לכל התרגולים שלי (${saved.length} שמורים · ${used.length} שעשיתי)</a>
  </section>`;
}
function renderMine(){
  const {saved, used} = minePractices();
  app.innerHTML = `<main class="wrap" id="main">
    ${homeWing()}${backLink('#/','חזרה לכריכה')}
    <div class="dhead"><h1>התרגולים שלי</h1><div class="m">נשמר בדפדפן הזה. בטלפון ובמחשב יש רשימה נפרדת.</div></div>
    <section class="sect" aria-labelledby="h-saved"><h2 id="h-saved">שמורים (${saved.length})</h2>
      ${saved.length?`<div class="grid">${saved.map(cardHtml).join('')}</div>`:`<p class="hint">בכל תרגול יש כפתור "לשמור בתרגולים שלי".</p>`}</section>
    <section class="sect" aria-labelledby="h-used"><h2 id="h-used">עשיתי (${used.length})</h2>
      ${used.length?`<ul class="mh">${used.map(p=>{ const u=MINE.used[p.id];
        return `<li><a href="#/p/${esc(p.id)}"><span class="tt">${esc(p.title)}</span><span class="c">${u.n>1?u.n+' פעמים · ':''}${heDate(u.last)}</span></a></li>`; }).join('')}</ul>`
        :`<p class="hint">אחרי תרגול עם הכיתה אפשר לסמן "עשיתי את זה", וכאן תיבנה הרשימה.</p>`}</section>
  </main>`;
}

/* ---------- מי משתמש/ת בפנקס (הכרעת שחף, 4.10.2026) ----------
   קישור אישי (?u=...) שנשלח מלשונית "שימוש" במסך התוספות. הפנקס זוכר אותו בדפדפן,
   ורושם כניסה, פתיחה, הקרנה, שמירה ו"עשיתי". האירועים נאספים בתור (שורד גם בלי רשת)
   ונשלחים בצרורות לשרת התוספות. אין כאן שום מידע על תלמידים. */
const USER_KEY = 'pinkasV2User', QUEUE_KEY = 'pinkasV2Queue', SEEN_KEY = 'pinkasV2Seen', DEV_KEY = 'pinkasV2Dev';
let USER = {u:'', name:''};
try{ Object.assign(USER, JSON.parse(localStorage.getItem(USER_KEY)||'{}')); }catch(e){}
(function(){
  const m = location.search.match(/[?&]u=([A-Za-z0-9-]{20,60})/);
  if(!m) return;
  if(USER.u!==m[1]) USER = {u:m[1], name:''};
  try{ localStorage.setItem(USER_KEY, JSON.stringify(USER)); }catch(e){}
  /* הקישור האישי לא נשאר בשורת הכתובת, כדי שלא יועתק הלאה בטעות */
  try{ history.replaceState(null, '', location.pathname + location.hash); }catch(e){}
})();
function devId(){
  let d = '';
  try{ d = localStorage.getItem(DEV_KEY)||''; }catch(e){}
  if(!/^[a-z0-9]{6,20}$/.test(d)){ d = Math.random().toString(36).slice(2,12).padEnd(8,'0'); try{ localStorage.setItem(DEV_KEY, d); }catch(e){} }
  return d;
}
let QUEUE = [];
try{ QUEUE = JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); if(!Array.isArray(QUEUE)) QUEUE=[]; }catch(e){ QUEUE=[]; }
function saveQueue(){ try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(QUEUE.slice(-300))); }catch(e){} }
/* פתיחה והקרנה נרשמות פעם ביום לכל תרגול, כדי שרענון לא ייספר כשימוש */
function seenToday(key){
  let s = {};
  try{ s = JSON.parse(localStorage.getItem(SEEN_KEY)||'{}'); }catch(e){}
  if(s.day!==todayKey()) s = {day:todayKey(), k:{}};
  if(s.k[key]) return true;
  s.k[key] = 1;
  try{ localStorage.setItem(SEEN_KEY, JSON.stringify(s)); }catch(e){}
  return false;
}
function track(a, p, m, always){
  if(!always && seenToday(a+'|'+(p?p.id:''))) return;
  QUEUE.push({a, p:p?p.id:'', m:m||0, ts:Date.now()});
  saveQueue();
  clearTimeout(track.t); track.t = setTimeout(flushUse, 1500);
}
let FLUSHING = false;
function flushUse(){
  if(FLUSHING || !QUEUE.length || (navigator.onLine===false)) return;
  FLUSHING = true;
  const batch = QUEUE.slice(0, 25);
  const s = document.createElement('script');
  const done = () => { FLUSHING = false; s.remove(); };
  window.__pinkasUse = function(r){
    done();
    if(!r || !r.ok) return;
    QUEUE.splice(0, batch.length); saveQueue();
    if(USER.u){
      if(!r.known){ USER = {u:'', name:''}; }
      else if(r.name && r.name!==USER.name){ USER.name = r.name; }
      try{ localStorage.setItem(USER_KEY, JSON.stringify(USER)); }catch(e){}
      const w = document.getElementById('who'); if(w) w.outerHTML = whoHtml();
    }
    if(QUEUE.length) setTimeout(flushUse, 500);
  };
  s.onerror = done;
  s.src = ADD_URL + '?api=use&u=' + encodeURIComponent(USER.u||'') + '&dev=' + devId()
        + '&ev=' + encodeURIComponent(JSON.stringify(batch)) + '&callback=__pinkasUse';
  document.body.appendChild(s);
}
window.addEventListener('online', flushUse);
function whoHtml(){
  if(!USER.u) return '';
  return `<div class="who" id="who"><span>הפנקס מזהה אותך${USER.name?' כ'+esc(USER.name):''} מהקישור האישי, וכך אנחנו יודעים באילו תרגולים משתמשים בבית הספר.</span><button type="button" data-act="forget">זה לא אני</button></div>`;
}
function forgetUser(){
  USER = {u:'', name:''};
  try{ localStorage.removeItem(USER_KEY); }catch(e){}
  render();
}

/* זמן לפי הצוות: לתרגול בלי זמן במקור, החציון של מה שהמורים סימנו ב"עשיתי" */
function fetchMinutes(){
  window.__pinkasMin = function(d){
    if(!d || typeof d!=='object') return;
    let any = false;
    D.practices.forEach(p=>{ if(!p.minutes && d[p.id]){ p.staffMin = +d[p.id]; any = true; } });
    if(any) render();
  };
  const s = document.createElement('script');
  s.src = ADD_URL + '?api=minutes&callback=__pinkasMin';
  s.onerror = function(){};
  document.body.appendChild(s);
}

/* ---------- התקנה בטלפון ועבודה בלי רשת (4.10.2026) ---------- */
let INSTALL = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); INSTALL = e; if(!parseHash().parts.length) render(); });
function isStandalone(){ return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }
function installHtml(){
  if(isStandalone()) return '';
  if(INSTALL) return `<button type="button" class="install" data-act="install">הוספת הפנקס למסך הבית של הטלפון</button>`;
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)) return `<span>באייפון: כפתור השיתוף בספארי, ואז "הוספה למסך הבית". כך הפנקס נפתח גם בלי רשת.</span>`;
  return '';
}
function doInstall(){
  if(!INSTALL) return;
  INSTALL.prompt();
  INSTALL.userChoice.finally(()=>{ INSTALL = null; render(); });
}
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ---------- התוספות של צוות השפה הקשובה, לקריאה בלבד ---------- */
function applyAdds(rows){
  const wDoor = {w1:1,w2:2,w3:3,w4:4,w5:5,w6:6};
  const LAYER_HOUSES = {'כולם':['צעירים','ביניים','חטיבה'],'צעירים':['צעירים'],'ביניים':['ביניים'],'חטיבה':['חטיבה'],'צוות':['צוות']};
  (rows||[]).forEach(a=>{
    if(!a || !a.id || byId(a.id)) return;
    const door = Number(a.door) || wDoor[a.world];
    if(!door) return;
    /* נושא שהצוות פתח בשם של נושא קיים מצטרף אליו, ולא מופיע פעמיים */
    let t = topicOf(a.topicId) || D.topics.find(x=>a.topicTitle && x.title===a.topicTitle);
    if(!t){
      t = {id:a.topicId || ('staff_d'+door), title:a.topicTitle || 'מהצוות', door:door, description:''};
      D.topics.push(t);
    }
    const docs = (a.docs||[]).filter(d=>d && (d.img||d.file));
    const type = a.type || ((docs.length ? docs.every(d=>d.kind==='מצגת') : !!a.file) ? 'deck' : 'page');
    /* בפעילות כל שורה היא שלב; בתרגול כתוב ובהקלטה זה טקסט רציף */
    const lines = String(a.text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
    const full = !a.text ? {} : (type==='activity' && lines.length>1 ? {steps:lines} : {text:a.text});
    D.practices.push({id:a.id, door:door, topic:t.id, type:type,
      title:a.title||'', what:a.explanation||'', img:a.img||'', file:a.file||(docs[0]&&docs[0].file)||'',
      docs: docs.length>1 ? docs : null, audio:a.audio||'', full:full,
      layer:a.layer||'', houses:LAYER_HOUSES[a.layer]||[], audience:a.audience||[], minutes:a.minutes||'',
      why:a.why||'', by:a.by||'', approvedBy:a.approvedBy||'', note:a.note||'', editedBy:a.editedBy||''});
  });
  render();
}
function fetchAdds(){
  window.__pinkasAdds = applyAdds;
  const s = document.createElement('script');
  s.src = ADDS_URL + '&v=2&callback=__pinkasAdds';
  s.onerror = function(){};  /* בלי רשת: הפנקס עובד כרגיל */
  document.body.appendChild(s);
}

render();
fetchAdds();
fetchBoger();
fetchMahalach();
fetchMinutes();
track('visit', null);
flushUse();
</script>
