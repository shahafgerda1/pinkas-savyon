<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>מרחב השפה הקשובה · כניסת צוות</title>
<link rel="icon" href="icon-32.png">
<meta name="theme-color" content="#54078F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@700;800&display=swap">
<style>
  :root{
    --brand:#54078F; --brand-dark:#3B0566; --bg:#F6F3EA; --ink:#2B1245; --ink2:#5B4A70;
    --soft:#E9DFF3; --line:#B9A8CC; --card:#fff; --ok:#1F7A4A; --bad:#A3271B; --warn:#8A4E0B;
  }
  /* דיאלוגים בתוך הדף. confirm/alert/prompt של הדפדפן אינם אמינים בתוך ה-iframe
     של Apps Script: הם עלולים לא להופיע, ואז הלחיצה לא עושה כלום בשקט. */
  .ask-back{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:center;
    justify-content:center;padding:16px;z-index:10000}
  .ask-box{background:var(--card);color:var(--ink);border-radius:16px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.35);
    width:100%;max-width:460px;max-height:88vh;overflow-y:auto;text-align:right}
  .ask-box h3{margin:0 0 10px;font-size:18px;font-family:Rubik,sans-serif}
  .ask-box .ask-msg{margin:0;line-height:1.65;white-space:pre-line;font-size:15px}
  .ask-box textarea{width:100%;min-height:110px;margin-top:12px;font:inherit;font-size:16px;padding:10px 12px;
    border:1px solid var(--line);border-radius:12px}
  .ask-foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .ask-foot button{min-height:44px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;border-radius:12px;padding:0 18px;
    border:2px solid var(--brand);background:var(--brand);color:#fff}
  .ask-foot button.ask-no{background:transparent;color:var(--brand)}

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,system-ui,sans-serif;font-size:16px;line-height:1.5;overflow-x:hidden}
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  h1,h2,h3{font-family:Rubik,sans-serif;margin:0}
  a{color:var(--brand)}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:18px}
  .top{display:flex;align-items:center;gap:12px}
  .top h1{font-weight:800;font-size:24px;color:var(--brand);line-height:1.1}
  .top .who{font-size:14px;color:var(--ink2)}
  .top .gap{flex:1}
  .tabs{display:flex;gap:6px;padding:4px;background:var(--soft);border-radius:14px}
  .tabs button{flex:1 1 0;min-height:44px;border:0;border-radius:10px;background:transparent;font:inherit;font-weight:600;font-size:15px;color:var(--ink);cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--brand);color:#fff;font-weight:700}
  .tabs.many{flex-wrap:wrap}
  .tabs.many button{flex:1 1 30%}
  .use-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .use-sum div{background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
  .use-sum b{font-family:Rubik,sans-serif;font-size:22px;color:var(--brand)}
  .use-sum span{font-size:13px;color:var(--ink2)}
  .use-sum .sumbtn{background:var(--soft);border:2px solid transparent;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:start;font:inherit;cursor:pointer;min-height:44px}
  .use-sum .sumbtn[aria-pressed="true"]{border-color:var(--brand)}
  .uitem{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #EEE8F4;padding:10px 0}
  .uitem:first-child{border-top:0}
  .uitem .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .uitem .t{font-weight:700;font-size:16px}
  .uitem .s{font-size:14px;color:var(--ink2)}
  .tabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:4px;border-radius:10px;background:#D4607A;color:#fff;font-size:13px}
  .card{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .card h2{font-size:19px}
  .sub{font-size:15px;color:var(--ink2);margin:0}
  .step{display:flex;flex-direction:column;gap:10px}
  .step>h3{font-size:17px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:22px;background:#fff;font:inherit;font-weight:600;font-size:15px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
  .chip .dot{width:16px;height:6px;border-radius:3px}
  .doors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .doors .chip{border-radius:14px;justify-content:flex-start;text-align:start;padding:8px 12px;line-height:1.25}
  label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink2)}
  input[type=text],input[type=email],input[type=number],textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  textarea{min-height:110px;resize:vertical}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row>.btn,.row>.btn2{flex:1 1 150px}
  .btn{min-height:52px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-family:Rubik,sans-serif;font-weight:700;font-size:17px;padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
  .btn:hover{background:var(--brand-dark)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn2{min-height:48px;border:2px solid var(--brand);border-radius:14px;background:transparent;color:var(--brand);font-family:Rubik,sans-serif;font-weight:700;font-size:16px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
  .btn3{min-height:44px;border:0;border-radius:12px;background:#F1EDF6;color:var(--ink2);font:inherit;font-weight:600;padding:0 14px;cursor:pointer}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:16px;cursor:pointer;min-height:44px;padding-top:10px}
  .check input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--brand)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font-size:14px;color:var(--ink2);margin:0}
  .warn{background:#FFF7EC;border-inline-start:4px solid #D98A2B;border-radius:10px;padding:10px 12px;font-size:15px;color:#5a3a10}
  .msg{border-radius:12px;padding:10px 12px;font-size:15px}
  .msg.ok{background:#EAF6EF;color:var(--ok)}
  .msg.err{background:#FBEDEB;color:var(--bad)}
  .pick{width:100%;min-height:48px;text-align:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;color:inherit;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
  .pick .ph{color:var(--ink2)}
  .rec{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;background:var(--brand);border-radius:18px;color:#fff}
  .rec .big{width:84px;height:84px;border-radius:42px;border:0;background:#fff;color:var(--brand);font-size:16px;font-weight:700;cursor:pointer}
  .rec .big.on{background:#D4607A;color:#fff}
  .rec audio{width:100%}
  /* קבצים שנבחרו */
  .fl{display:flex;gap:10px;align-items:center;border-top:1px solid #EEE8F4;padding:10px 0}
  .fl:first-child{border-top:0}
  .fl .th{width:56px;height:56px;border-radius:10px;background:var(--soft);flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:13px;color:var(--ink2)}
  .fl .th img{width:100%;height:100%;object-fit:cover}
  .fl .fx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .fl .s{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fl .acts{display:flex;gap:4px}
  .fl .st{font-size:13px;font-weight:700}
  .fl .st.up{color:var(--ink2)} .fl .st.done{color:var(--ok)} .fl .st.err{color:var(--bad)}
  .fl.done .th{outline:2px solid var(--ok)}
  .upsum{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--ok)}
  .fl .acts button{min-width:44px;min-height:44px;border:0;border-radius:10px;background:#F1EDF6;color:var(--ink2);cursor:pointer;font-size:15px}
  /* רשימות */
  .item{display:flex;gap:12px;align-items:flex-start;border-top:1px solid #EEE8F4;padding:12px 0}
  .item:first-child{border-top:0}
  .item .th{width:72px;height:72px;border-radius:12px;background:var(--soft);flex:0 0 auto;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);text-align:center}
  .item .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .item .t{font-family:Rubik,sans-serif;font-weight:700;font-size:16px}
  .item .s{font-size:14px;color:var(--ink2)}
  .item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .pill{display:inline-block;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:700}
  .pill.wait{background:#FFF1D6;color:var(--warn)}
  .pill.live{background:#E3F4EA;color:var(--ok)}
  .pill.back{background:#FBE3E6;color:var(--bad)}
  .svrow{font:inherit;color:inherit;text-align:start;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
  .svrow:hover,.svrow:focus-visible{background:var(--soft)}
  .svgo{margin-inline-start:auto;color:var(--brand);font-size:13px;font-weight:700}
  .svsel{min-height:44px;font:inherit;font-size:16px;padding:0 10px;border:1px solid var(--line);border-radius:12px;background:#fff;max-width:100%}
  .note{background:#FBF3F4;border-inline-start:3px solid #D4607A;border-radius:8px;padding:8px 10px;font-size:14px;white-space:pre-line}
  /* אישור */
  .rv{border:1px solid #EEE8F4;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .rv .tags{display:flex;flex-wrap:wrap;gap:6px}
  .rv .tag{background:var(--soft);border-radius:12px;padding:3px 10px;font-size:13px;font-weight:600}
  .rv .prev{display:flex;gap:8px;overflow-x:auto}
  .rv .prev img{height:140px;border-radius:10px;background:#fff;border:1px solid #EEE8F4}
  .rv .prev a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:10px;background:var(--soft);font-weight:700;text-decoration:none}
  .rv .text{white-space:pre-line;background:#FBFAFD;border-radius:10px;padding:10px 12px;font-size:15px;max-height:260px;overflow-y:auto}
  .rv audio{width:100%}
  /* בורר מותאם. לא select, כי ב-iframe של Apps Script הוא לא נפתח בנייד */
  .sheet{position:fixed;inset:0;background:rgba(20,16,30,.45);display:none;z-index:50}
  .sheet.open{display:block}
  .sheet .in{position:absolute;inset-inline:0;bottom:0;max-height:86vh;background:#fff;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
  .sheet .hd{padding:14px;border-bottom:1px solid #EEE8F4;display:flex;gap:10px;align-items:center}
  .sheet .bd{padding:8px 14px 20px;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
  .sheet .opt{min-height:44px;padding:10px;border-bottom:1px solid #EEE8F4;cursor:pointer;border-radius:10px;display:flex;align-items:center}
  .sheet .opt:hover{background:var(--soft)}
  .lnk{background:#FBFAFD;border:1px solid #EEE8F4;border-radius:12px;padding:10px;font-size:14px;word-break:break-all}
  /* שיוך בוגר סביון */
  .bg{border:1px solid #EEE8F4;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .bg.ok{background:#F4FBF6;border-color:#CBE8D6}
  .bg .ex{font-size:14px;color:var(--ink2);margin:0}
  .bg .props{display:flex;flex-direction:column;gap:6px}
  .bg .prop{display:flex;gap:8px;align-items:flex-start;font-size:15px}
  .bg .prop .dot,.bpart .dot{width:12px;height:12px;border-radius:6px;flex-shrink:0;margin-top:5px}
  .bg .who{font-size:13px;color:var(--ink2)}
  .bg .cm{font-size:14px;background:#FBFAFD;border-radius:8px;padding:6px 10px}
  .bg .done{font-weight:700;color:var(--ok)}
  .bpart{border:1px solid #EEE8F4;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
  .bpart h4{margin:0 0 4px;font-family:Rubik,sans-serif;font-size:15px;display:flex;gap:8px;align-items:center}
  .bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
  .bar i{display:block;height:8px;background:var(--ok)}
  /* המהלך השנתי: שידוך תרגולים לשלבים */
  .mhs{display:flex;flex-direction:column}
  .mhs a.st{display:flex;gap:12px;align-items:center;border-top:1px solid #EEE8F4;padding:10px 4px;text-decoration:none;color:inherit;min-height:56px}
  .mhs a.st:first-child{border-top:0}
  .mhs a.st:hover{background:#FBFAFD}
  .mhs .num{width:34px;height:34px;border-radius:17px;color:#fff;font-family:Rubik,sans-serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mhs .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .mhs .t{font-weight:700;font-size:16px}
  .mhs .s{font-size:14px;color:var(--ink2)}
  .mhs .s b{color:var(--ok)}
  .mhs .dom{font-family:Rubik,sans-serif;font-size:15px;margin:14px 0 2px;display:flex;align-items:center;gap:8px}
  .mhs .dom .dot{width:12px;height:12px;border-radius:6px}
  .mh-status{font-size:14px;color:var(--ink2);min-height:20px}
  .mh-status.err{color:var(--bad);font-weight:700}
  .mon{display:flex;flex-wrap:wrap;gap:6px}
  .mon .chip{min-width:64px;justify-content:center;padding:0 12px}
  .pr{display:flex;gap:10px;align-items:center;border-top:1px solid #EEE8F4;padding:10px 0}
  .pr:first-child{border-top:0}
  .pr .th{width:64px;height:64px;border-radius:10px;background:var(--soft);flex:0 0 auto;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);text-align:center;padding:4px;overflow:hidden}
  .pr .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .pr .t{font-weight:700;font-size:15px;color:var(--ink);text-decoration:none}
  .pr .t:hover{text-decoration:underline}
  .pr .s{font-size:13px;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .pr .acts{display:flex;gap:4px;flex-shrink:0}
  .pr .acts button{min-width:44px;min-height:44px;border:0;border-radius:10px;background:#F1EDF6;color:var(--ink2);cursor:pointer;font:inherit;font-size:16px;font-weight:700}
  .pr .acts button.add{background:var(--brand);color:#fff;padding:0 12px}
  .pr .acts button.star[aria-pressed="true"]{background:#FFF1D6;color:#B7791F}
  .pr.starter{background:#FFFBF2;border-radius:12px;padding-inline:8px}
  .tagS{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;background:#FFF1D6;color:#8A4E0B;margin-inline-start:6px}
  .tagW{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;background:#FBE3E6;color:var(--bad);margin-inline-start:6px}
  .mhnav{display:flex;gap:8px;flex-wrap:wrap}
  @media (max-width:520px){ .pr.ch{flex-wrap:wrap} .pr.ch .acts{width:100%;justify-content:flex-end} }
  .mhnav .btn3{flex:1 1 140px}
  @media (min-width:620px){ .doors{grid-template-columns:repeat(3,minmax(0,1fr))} }
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"><p class="sub" style="padding:24px 0">רגע, טוען...</p></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="in">
  <div class="hd">
    <strong id="sheetTitle">בחירה</strong>
    <button class="btn3" style="margin-inline-start:auto" onclick="closeSheet()">סגירה</button>
  </div>
  <div class="bd" id="sheetBody"></div>
</div></div>

<script>
var GAS = "https://script.google.com/macros/s/AKfycbwwr4eOX9jFACxB_nyTfk0k-wOOCTKozJE6SIRFRFNjcOZdcvSDWVX5QdmFerebVixoeg/exec";
var KS = "pk_ses", KT = "pk_tok", KD = "pk_dev", KPLAN = "pinkasPlannerToken";
var TOKEN = "", SESSION = "", SETUP = "", VIEW0 = "", DEV = "";
(function(){
  try{
    var q = new URLSearchParams(location.search), t = q.get("t");
    if(t) localStorage.setItem(KT, t);
    TOKEN = localStorage.getItem(KT) || ""; SESSION = localStorage.getItem(KS) || "";
    DEV = localStorage.getItem(KD) || "";
    if(!DEV){ DEV = Math.random().toString(36).slice(2, 12); localStorage.setItem(KD, DEV); }
    var v = q.get("view") || (location.hash || "").replace(/^#\/?/, "");
    if(/^(new|mine|review|boger|mahalach|settings)$/.test(v)) VIEW0 = v;
    if(t || q.get("view")) history.replaceState(null, "", location.pathname + (VIEW0 ? "#" + VIEW0 : ""));
  }catch(e){}
})();
var ME = null, META = null, TAB = "new";
var TYPES = [
  {id:"page", label:"דף להקרנה"}, {id:"audio", label:"הקלטה"}, {id:"activity", label:"פעילות"},
  {id:"write", label:"תרגול כתוב"}, {id:"deck", label:"מצגת"}
];
var TYPE_LABEL = {}; TYPES.forEach(function(t){ TYPE_LABEL[t.id] = t.label; });
var AUD = [{id:"class",label:"לכיתה"},{id:"student",label:"לתלמיד אחד"},{id:"staff",label:"לצוות"}];
var LAYERS = ["כולם","צעירים","ביניים","חטיבה","צוות"];
var DOOR_FALLBACK = [
  {n:1,title:"להגיע ולהרגיש",color:"#3AA66F"},{n:2,title:"לעשות סדר במחשבות",color:"#7C5CC4"},
  {n:3,title:"לתכנן ולהתאמץ נכון",color:"#D98A2B"},{n:4,title:"להתמודד עם רגש או אירוע",color:"#D4607A"},
  {n:5,title:"להתחבר לאחר",color:"#2F9AA6"},{n:6,title:"להקשיב ולהיות נוכח",color:"#4A7BD0"}
];
/* הטופס כולו במקום אחד, כדי שבנייה מחדש של המסך לא תמחק מה שנכתב */
var F = null;
function newForm(){
  F = {type:"", title:"", explanation:"", door:0, topicId:"", topicTitle:"", audience:[], minutes:"", layer:"",
       text:"", caution:"", hideName:false, consent:false, files:[], audio:null, group:{id:null, done:0}};
}
newForm();
var MAX_FILES = 10, MAX_AUDIO_MB = 25, MAX_PPT_MB = 25;
var PPT_MIMES = {pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation", ppt:"application/vnd.ms-powerpoint"};
var PPT_ACCEPT = ".pptx,.ppt," + PPT_MIMES.pptx + "," + PPT_MIMES.ppt;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ── דיאלוגים בתוך הדף ── הכלל: פעולה לעולם אינה מסתיימת בלי סימן על המסך. */
var ASK_OPEN = null;
function askClose(){ if(!ASK_OPEN) return; var el = ASK_OPEN; ASK_OPEN = null; el.remove(); }
function askBox(o){
  askClose();
  var back = document.createElement("div"); back.className = "ask-back";
  var box = document.createElement("div"); box.className = "ask-box";
  box.setAttribute("role","dialog"); box.setAttribute("aria-modal","true");
  if(o.title){ var h = document.createElement("h3"); h.textContent = o.title; box.appendChild(h); }
  var msg = document.createElement("p"); msg.className = "ask-msg"; msg.textContent = o.text || ""; box.appendChild(msg);
  var ta = null;
  if(o.input){ ta = document.createElement("textarea"); ta.value = o.value || ""; if(o.placeholder) ta.placeholder = o.placeholder; box.appendChild(ta); }
  var foot = document.createElement("div"); foot.className = "ask-foot";

/* ── בדיקת סיווג (14.10.2026) ──────────
   לכל פריט: הסוג, נושא הבית והנושאים הנוספים, וסימון ⚠ כשהסוג לא תואם את התוכן.
   אותם כללים כמו בסקריפט פנקס תרגולים\בדיקות\בדיקת-סיווג-שבוע.js.
   לחיצה על פריט פותחת אותו במלואו, ושם אפשר לשנות סוג ונושאים. השינוי נשמר בלשונית `סיווג`
   בגיליון התוספות (apiSivugSave), והאתר מחיל אותו על data-v2.js (applySivug ב-index.html).
   SV.base הוא הסיווג שבקובץ, לפני השינויים, כדי שאפשר יהיה לחזור אליו. */
var SV = {pick:"", q:"", base:null, ov:{}, ovErr:false};

  if(window.PINKAS && window.PINKAS.practices && SV.base) return svDraw();

/* הסיווג שבקובץ נשמר בצד, ואז נטענים השינויים מהמרחב ומוחלים כמו באתר */
function svLoadOv(){
  var D = window.PINKAS;
  if(!D || !D.practices) return svDraw();
  SV.base = {};
  D.practices.forEach(function(p){ SV.base[p.id] = {type:p.type, topic:p.topic, door:p.door, also:(p.also||[]).slice()}; });
  var cb = "__svOv" + Date.now(), s = document.createElement("script"), done = false;
  var fin = function(items, err){
    if(done) return; done = true; delete window[cb]; SV.ovErr = !!err; SV.ov = {};
    Object.keys(items || {}).forEach(function(id){ if(svApply(id, items[id])) SV.ov[id] = items[id]; });
    svDraw();
  };
  window[cb] = function(d){ fin(d && d.items, false); };
  s.onerror = function(){ fin({}, true); };
  setTimeout(function(){ fin({}, true); }, 15000);
  s.src = GAS + "?api=sivug&callback=" + cb + "&n=" + Date.now();
  document.body.appendChild(s);
}
function svTopic(id){ return (window.PINKAS.topics || []).filter(function(t){ return t.id === id; })[0]; }
function svPr(id){ return window.PINKAS.practices.filter(function(p){ return p.id === id; })[0]; }
/* o = {type, topic, also} או null (חזרה לקובץ). אותו כלל כמו applySivug באתר. */
function svApply(id, o){
  var p = svPr(id), b = SV.base[id]; if(!p || !b) return false;
  var src = o || b, t = svTopic(src.topic); if(!t) return false;
  p.type = src.type || b.type; p.topic = t.id; p.door = t.door;
  var also = (src.also || []).filter(function(x){ return x !== t.id && svTopic(x); });
  if(also.length) p.also = also; else delete p.also;
  return true;
}

function svSave(id, reset){
  var p = svPr(id), b = SV.base[id]; if(!p || !b) return;
  var data = null;
  if(!reset){
    var topic = $("svH").value;
    var also = [].slice.call(document.querySelectorAll("#svA input:checked")).map(function(x){ return x.value; }).filter(function(x){ return x !== topic; });
    data = {type:$("svT").value, topic:topic, also:also};
    /* אותו סיווג כמו בקובץ: אין מה לשמור, ושורה קיימת נמחקת */
    var same = data.type === b.type && data.topic === b.topic && also.slice().sort().join() === (b.also||[]).slice().sort().join();
    if(same) data = null;
    if(!data && !SV.ov[id]){ closeSheet(); return; }
  }
  var btn = $("svSave"); if(btn){ btn.disabled = true; btn.textContent = "שומר..."; }
  srv("apiSivugSave", function(r){
    svApply(id, data);
    if(data){ data.by = r.by; data.updated = r.updated; SV.ov[id] = data; } else delete SV.ov[id];
    closeSheet(); svDraw();
    notify(data ? "הסיווג נשמר. באתר הוא יופיע תוך כשתי דקות." : "חזר לסיווג המקורי.");

function svFlags(p, topic){
  var f = [], full = p.full || {}, steps = full.steps && full.steps.length;
  if(!SV_LABEL[p.type]) f.push("סוג לא מוכר");
  if(p.type === "activity" && !steps) f.push("פעילות בלי שלבים");
  if(p.type === "write" && !full.text) f.push("תרגול כתוב בלי טקסט רציף");
  if(p.type !== "activity" && steps) f.push('יש שלבים, אבל הסוג "' + (SV_LABEL[p.type]||p.type) + '"');
  if(p.type !== "write" && full.text) f.push('יש טקסט רציף, אבל הסוג "' + (SV_LABEL[p.type]||p.type) + '"');
  if(p.type === "page" && !p.img && !p.file && !(p.docs && p.docs.length)) f.push("דף בלי תמונה או קובץ");
  if(!topic(p.topic)) f.push("נושא הבית אינו קיים");
  (p.also||[]).forEach(function(a){ if(!topic(a)) f.push("נושא נוסף אינו קיים"); });

function svDraw(){
  var el = $("sv"); if(!el) return;
  var D = window.PINKAS;
  if(!D || !D.practices){ el.innerHTML = '<div class="msg err">לא הצלחתי לטעון את נתוני הפנקס.</div>'; return; }
  var T = {}; D.topics.forEach(function(t){ T[t.id] = t; });
  var topic = function(id){ return T[id]; };
  var tname = function(id){ return T[id] ? T[id].title : "(נושא לא קיים)"; };
  var weeks = D.weekly || [], today = new Date().toISOString().slice(0,10);
  if(!SV.pick){
    var cur = weeks.filter(function(w){ return w.from <= today && today <= w.to; })[0];
    SV.pick = cur ? "w:" + cur.from : (weeks[0] ? "w:" + weeks[0].from : "all");
  }
  var dm = function(s){ var p = s.split("-"); return Number(p[2]) + "." + Number(p[1]); };
  /* שבוע הוא נושא אחד (topic) או שלב במהלך השנתי עם כמה נושאים (topics, 14.10.2026) */
  var wTopics = function(w){ return w.topics || (w.topic ? [w.topic] : []); };
  var inAny = function(p, ids){ return ids.indexOf(p.topic) >= 0 || (p.also||[]).some(function(a){ return ids.indexOf(a) >= 0; }); };
  var sel = function(v){ return SV.pick === v ? " selected" : ""; };
  var opts = '<optgroup label="לפי שבוע">' + weeks.map(function(w){
    var tag = w.from <= today && today <= w.to ? " (השבוע)" : (w.from > today ? " (בהמשך)" : "");
    return '<option value="w:'+w.from+'"'+sel("w:"+w.from)+'>שבוע '+dm(w.from)+'-'+dm(w.to)+': '+esc(w.title || tname(w.topic))+tag+'</option>';
  }).join("") + '</optgroup><optgroup label="לפי נושא">' +
    D.topics.slice().sort(function(a,b){ return a.title.localeCompare(b.title, "he"); }).map(function(t){
      return '<option value="t:'+t.id+'"'+sel("t:"+t.id)+'>'+esc(t.title)+'</option>';
    }).join("") + '</optgroup><optgroup label="כל הפנקס">' +
    '<option value="flag"'+sel("flag")+'>רק פריטים חשודים</option><option value="all"'+sel("all")+'>הכול</option></optgroup>';
  var list, q = (SV.q || "").trim();
  if(q){
    /* חיפוש לפי שם, בכל הפנקס: שם התרגול, או שם נושא שהוא בו (למשל "כוחה של מילה") */
    list = D.practices.filter(function(p){
      return (p.title||"").indexOf(q) >= 0 || [p.topic].concat(p.also||[]).some(function(a){ return tname(a).indexOf(q) >= 0; });

/* ── קבצים: כל תמונה מוקטנת ל-1600px בדפדפן, וכך גם יורד ממנה ה-EXIF ── */
function readOne(f, cb){
  /* PowerPoint עולה כמות שהוא, והשרת הופך אותו ל-PDF. בטלפון f.type לפעמים ריק, ולכן גם לפי הסיומת. */
  var pext = (String(f.name).match(/\.(pptx?)$/i) || [])[1];
  if(pext || f.type === PPT_MIMES.pptx || f.type === PPT_MIMES.ppt){
    if(f.size > MAX_PPT_MB*1024*1024){ cb(null, 'המצגת "'+f.name+'" גדולה מדי (מעל '+MAX_PPT_MB+' מגה).'); return; }
    var mime = f.type === PPT_MIMES.ppt || /^ppt$/i.test(pext||"") ? PPT_MIMES.ppt : PPT_MIMES.pptx;
    var rp = new FileReader();
    rp.onerror = function(){ cb(null, 'לא הצלחתי לקרוא את "'+f.name+'".'); };
    rp.onload = function(){ cb({b64:rp.result.split(",")[1], mime:mime, name:"", file:f.name, prev:"", tag:"PPT"}); };
    rp.readAsDataURL(f); return;
  }
  if(f.type === "application/pdf"){
    if(f.size > 12*1024*1024){ cb(null, 'הקובץ "'+f.name+'" גדול מדי (מעל 12 מגה).'); return; }
    var r = new FileReader();
    r.onerror = function(){ cb(null, 'לא הצלחתי לקרוא את "'+f.name+'".'); };
    r.onload = function(){ cb({b64:r.result.split(",")[1], mime:"application/pdf", name:"", file:f.name, prev:""}); };
    r.readAsDataURL(f); return;
  }
  var r2 = new FileReader();
  r2.onerror = function(){ cb(null, 'לא הצלחתי לקרוא את "'+f.name+'".'); };
  r2.onload = function(){
    var img = new Image();
    img.onerror = function(){ cb(null, 'הקובץ "'+f.name+'" אינו תמונה תקינה.'); };
    img.onload = function(){
      var max = 1600, w = img.width, h = img.height;
      if(w > max || h > max){ var s = Math.min(max/w, max/h); w = Math.round(w*s); h = Math.round(h*s); }
      var c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      var d = c.toDataURL("image/jpeg", 0.86);
      cb({b64:d.split(",")[1], mime:"image/jpeg", name:"", file:f.name, prev:d});
    };
    img.src = r2.result;
  };
  r2.readAsDataURL(f);
}
function readMany(list, done){
  var out = [], errs = [], i = 0;
  (function next(){
    if(i >= list.length) return done(out, errs);
    readOne(list[i++], function(o, err){ if(o) out.push(o); else if(err) errs.push(err); next(); });
  })();
}
function addFiles(inp){
  syncForm();
  var list = Array.prototype.slice.call(inp.files || []); inp.value = "";
  if(!list.length) return;
  var room = MAX_FILES - F.files.length;
  if(room <= 0){ showErr({message:"אפשר עד "+MAX_FILES+" מסמכים בתרגול אחד."}); return; }
  if(list.length > room) list = list.slice(0, room);
  showOk("רגע, קורא את הקבצים...");
  readMany(list, function(items, errs){
    F.files = F.files.concat(items); renderFiles();
    if(errs.length) showErr({message:errs.join(" ")});
    else showOk(items.length === 1 ? "הקובץ נקלט." : items.length+" קבצים נקלטו.");
  });
}
/* מצב ההעלאה של כל קובץ (st): ריק = עוד לא נשלח · up = עולה עכשיו · done = עלה ונשמר · err = לא עלה */
function fileState(f){
  if(f.st === "up") return '<span class="st up">'+(f.tag==="PPT"?"הופך ל-PDF ועולה...":"עולה...")+'</span>';
  if(f.st === "done") return '<span class="st done">✓ עלה ונשמר</span>';
  if(f.st === "err") return '<span class="st err">לא עלה</span>';
  return "";
}
function renderFiles(){
  var box = $("files"); if(!box) return;
  var done = F.files.filter(function(f){ return f.st === "done"; }).length;
  box.innerHTML = (F.files.length && done ? '<p class="upsum">'+done+' מתוך '+F.files.length+' קבצים עלו</p>' : '') +
    F.files.map(function(f, i){
    var locked = f.st === "done" || f.st === "up";
    return '<div class="fl'+(f.st?' '+f.st:'')+'"><div class="th">'+(f.prev?'<img src="'+f.prev+'" alt="">':(f.tag||'PDF'))+'</div>' +
      '<div class="fx"><input type="text" class="dn" data-i="'+i+'" maxlength="80" aria-label="שם המסמך" placeholder="שם או דיוק, לא חובה" value="'+esc(f.name)+'"'+(locked?' disabled':'')+'>' +
      '<span class="s">'+esc(f.file)+'</span>'+fileState(f)+'</div>' +
      '<div class="acts">'+(locked?'':'<button type="button" aria-label="הסרת הקובץ" onclick="dropFile('+i+')">✕</button>')+'</div></div>';
  }).join("");
}
function dropFile(i){ syncForm(); F.files.splice(i,1); renderFiles(); }

/* ── הקלטה ───────────────────────────────────────────────────
   הקלטה ישירה דרך המיקרופון. אם הדפדפן חוסם אותה בתוך הדף (קורה בתוך
   מסגרת של Apps Script), נשארת הבחירה בקובץ, שבטלפון פותחת את המקליט. */
var REC = {on:false, mr:null, chunks:[], t0:0, timer:null};
function toggleRec(){
  syncForm();
  if(REC.on){ REC.mr.stop(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ notify('הדפדפן הזה לא מאפשר להקליט מתוך הדף. אפשר ללחוץ על "לבחור קובץ הקלטה", ובטלפון זה פותח את המקליט.'); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    REC.chunks = []; REC.mr = new MediaRecorder(stream);
    REC.mr.ondataavailable = function(e){ if(e.data.size) REC.chunks.push(e.data); };
    REC.mr.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      clearInterval(REC.timer); REC.on = false;
      var type = REC.mr.mimeType || "audio/webm";
      setAudio(new Blob(REC.chunks, {type:type}), "הקלטה מהדף", type.indexOf("mp4")>=0 ? "m4a" : "webm");
    };
    REC.mr.start(); REC.on = true; REC.t0 = Date.now();
    renderNew();
    REC.timer = setInterval(function(){ var s = Math.floor((Date.now()-REC.t0)/1000);
      if($("recTime")) $("recTime").textContent = "מקליט " + Math.floor(s/60) + ":" + ("0"+s%60).slice(-2); }, 500);
  }).catch(function(){
    notify('אין גישה למיקרופון מתוך הדף. אפשר ללחוץ על "לבחור קובץ הקלטה", ובטלפון זה פותח את המקליט.');
  });
}
function pickAudio(inp){
  syncForm();
  var f = inp.files && inp.files[0]; inp.value = "";
  if(!f) return;
  var ext = (f.name.split(".").pop() || "m4a").toLowerCase();
  setAudio(f, f.name, ext);
}
function setAudio(blob, label, ext){
  if(blob.size > MAX_AUDIO_MB*1024*1024){ showErr({message:"ההקלטה גדולה מ-"+MAX_AUDIO_MB+" מגה."}); return; }
  var r = new FileReader();
  r.onload = function(){
    F.audio = {b64:r.result.split(",")[1], mime:blob.type || "audio/mp4", ext:ext, label:label, url:URL.createObjectURL(blob)};
    renderNew(); showOk("ההקלטה נקלטה. אפשר להאזין לה לפני השליחה.");
  };
  r.readAsDataURL(blob);
}

/* ── שליחה ── מסמך אחרי מסמך. כשלון באמצע משאיר את מה שעלה וממשיך משם. */
function formObj(){
  return {type:F.type, title:F.title, explanation:F.explanation, door:F.door, topicId:F.topicId,
          audience:F.audience, minutes:F.minutes, layer:F.layer, text:F.text, caution:F.caution, hideName:F.hideName, consent:F.consent,
          hasFiles: F.files.length > 0 || !!F.audio};
}
/* מה שעוד לא עלה. קובץ שעלה נשאר ברשימה עם סימון, כדי שרואים מה כבר נשמר. */
function uploads(){
  var list = F.files.filter(function(f){ return f.st !== "done"; });
  if(F.audio && F.audio.st !== "done") list.push(F.audio);
  return list;
}
function submitNew(){
  syncForm();
  var t = F.type;
  if((t === "page" || t === "deck") && !F.files.length && !F.group.done){ showErr({message:"עוד לא נבחרו קבצים."}); return; }
  if(t === "audio" && !F.audio && !F.group.done){ showErr({message:"עוד אין הקלטה."}); return; }
  if(F.group.id) return uploadNext();
  busy(true, "בודק...");
  srv("apiAddStart", function(r){
    F.group.id = r.groupId;
    if(r.written) return finishNew();
    uploadNext();
  }, [auth(), formObj()]);
}
function uploadNext(){
  var list = uploads();
  if(!list.length) return finishNew();
  var f = list[0], n = F.group.done + 1, total = F.group.done + list.length;
  busy(true, "מעלה "+n+" מתוך "+total+"...");
  showOk("מעלה "+n+" מתוך "+total+(f.tag==="PPT"?" (מצגת PowerPoint הופכת ל-PDF, זה לוקח כחצי דקה)":"")+". לא לסגור את הדף.");
  f.st = "up"; renderFiles();
  srv("apiAddDoc", function(){
    f.st = "done"; F.group.done++; renderFiles(); uploadNext();

/* ── התרגולים שלי ─────────────────────────────────────────── */
var MINE = [];

}
function thumb(r){

}
function renderMine(){

    $("mine").innerHTML = rows.map(function(r){

        '<div class="acts"><button class="btn3" onclick="editOne(\''+r.id+'\')">'+(r.status==="הוחזר"?"תיקון ושליחה מחדש":"עריכה")+'</button>' +
        '<button class="btn3" onclick="delOne(\''+r.id+'\')">הסרה</button></div>' +

function mineById(id){ return MINE.filter(function(x){ return x.id === id; })[0]; }

    ((r.type==="write"||r.type==="activity"||r.type==="audio") ? '<label class="f">'+(r.type==="activity"?"איך עושים":"הטקסט המלא")+'<textarea id="eX">'+esc(r.text)+'</textarea></label>' : '') +

function rvReady(id){

function approve(id){

function giveBack(id){

/* קובץ הנתונים של האתר בתג script, ואחריו התוספות שפורסמו (אותו JSONP שהאתר משתמש בו) */
function mhLoadPinkas(cb){
  var done = cb;
  var s = document.createElement("script");
  s.src = PK_BASE + "data-v2.js?d=" + new Date().toISOString().slice(0,13);
  s.onload = function(){
    var d = window.PINKAS;
    if(!d || !d.practices){ return mhLoadFail(); }
    MH_P = {byId:{}, list:[], topics:{}, doors:d.doors || []};
    d.topics.forEach(function(t){ MH_P.topics[t.id] = t; });
    /* נושא שמופיע פעמיים באותו שם נחשב אחד, בדיוק כמו topicAlias באתר */
    MH_P.alias = {}; var firstByTitle = {};
    d.topics.forEach(function(t){ if(!firstByTitle[t.title]) firstByTitle[t.title] = t.id; });
    d.topics.forEach(function(t){ var f = firstByTitle[t.title]; MH_P.alias[t.id] = f; MH_P.alias[f] = f; });
    d.practices.forEach(function(p){
      var img = p.img || (p.docs && p.docs[0] && p.docs[0].img) || "";
      mhPut({id:p.id, title:p.title||"", what:p.what||"", topic:p.topic, door:Number(p.door)||0, type:p.type,
             img:img ? new URL(img, PK_BASE).href : "", note:p.note||"",
             staff:(p.houses||[]).length === 1 && p.houses[0] === "צוות"});
    });
    window.__mhAdds = function(rows){
      (rows||[]).forEach(function(a){
        if(!a || !a.id || MH_P.byId[a.id]) return;
        var t = MH_P.topics[a.topicId] || d.topics.filter(function(x){ return a.topicTitle && x.title === a.topicTitle; })[0];
        var tid = t ? t.id : (a.topicId || "");
        if(!t && tid) MH_P.topics[tid] = {id:tid, title:a.topicTitle || "מהצוות", door:Number(a.door)||0};
        mhPut({id:a.id, title:a.title||"", what:a.explanation||"", topic:tid, door:Number(a.door)||0, type:a.type||"page",
               img:a.img||"", note:a.note||"", staff:a.layer === "צוות", fromStaff:true});
      });
      /* התוספות מגיעות אחרי שהמסך כבר עלה: מעדכנים רק את הרשימות, בלי לגעת בשדות שבכתיבה */
      if(TAB === "mahalach" && MH){ if(MH_STEP) mhRefresh(); else mhDrawList(); }
    };
    var a = document.createElement("script");
    a.src = MH_ADDS + "&callback=__mhAdds";
    document.body.appendChild(a);
    done();   /* בלי תוספות המסך עובד, רק בלי מה שהצוות העלה */
  };
  s.onerror = mhLoadFail;
  document.body.appendChild(s);
}
function mhPut(p){ MH_P.byId[p.id] = p; MH_P.list.push(p); }
function mhLoadFail(){
  $("pane").innerHTML = '<div class="card"><h2>לא הצלחתי לטעון את האתר</h2>' +

function mhStepLine(s){
  var bits = [], n = s.practices.length;
  if(n){
    var st = s.starter && MH_P.byId[s.starter];
    bits.push('<b>'+n+' תרגולים</b>' + (st ? ' · מתחילים ב"' + esc(st.title) + '"' : ''));
  } else {
    var k = mhSuggest(s).length;
    bits.push('עוד לא בחרת' + (k ? ' · ' + k + ' הצעות מחכות' : ''));
  }
  if(s.months.length) bits.push(s.months.map(function(m){ return MONTH_LABEL[m]; }).join(", "));
  if(s.missing) bits.push('<span class="tagW" style="margin:0">חסר תרגול</span>');
  if(s.note) bits.push('יש הערה לצוות');
  return bits.join(" · ");
}

    'כל סימון עולה לאתר מיד. בשלב שעוד לא בחרת בו, האתר ממשיך להציג את ההצעה של היום.</p>' +

    '<div class="chips" role="group" aria-label="סינון">' + chips.map(function(c){

/* ── שלב אחד ── */
function mhSuggest(s){
  var want = {}; s.topics.forEach(function(t){ want[t] = 1; want[MH_P.alias[t] || t] = 1; });
  return MH_P.list.filter(function(p){ return (want[p.topic] || want[MH_P.alias[p.topic]]) && s.practices.indexOf(p.id) < 0; });
}
function mhRow(p, mode, k, n, s){

    : '<button type="button" class="star" aria-pressed="' + (s.starter === p.id) + '" onclick="mhStar(\'' + p.id + '\')" title="מתחילים בו" aria-label="מתחילים ב' + esc(p.title) + '">★</button>' +
      '<button type="button" onclick="mhMove(\'' + p.id + '\',-1)"' + (k === 0 ? ' disabled' : '') + ' aria-label="להקדים">↑</button>' +

  return '<div class="pr' + (mode === "add" ? '' : ' ch') + (s && s.starter === p.id ? ' starter' : '') + '">' + thumb +
    '<span class="bd"><a class="t" href="' + PK_BASE + '#/p/' + encodeURIComponent(p.id) + '" target="_blank" rel="noopener">' + esc(p.title) + '</a>' + tags +
    '<span class="s">' + esc(sub) + '</span></span><span class="acts">' + acts + '</span></div>';

      '<label class="f">הערה לצוות. תופיע באתר מעל התרגולים של השלב (לא חובה)<textarea id="mhNote" maxlength="600" onchange="mhNote()">' + esc(s.note) + '</textarea></label>' +

        if(!p) return '<div class="pr ch"><span class="th">?</span><span class="bd"><span class="t">תרגול שכבר אינו באתר</span><span class="s">אולי הוסר או שונה. אפשר להסיר אותו מהשלב.</span></span>' +
          '<span class="acts"><button type="button" onclick="mhRemove(\'' + esc(id) + '\')" aria-label="להסיר">✕</button></span></div>';

function mhResults(){
  var s = mhStep(MH_STEP), box = $("mhRes"); if(!box) return;
  var q = MH_Q.trim(), list = [], head = "";

    var t = MH_P.topics[MH_TOPIC];

  } else if(q.length >= 2){
    var lq = q.toLowerCase();
    list = MH_P.list.filter(function(p){ var t = MH_P.topics[p.topic];
      return (p.title + " " + p.what + " " + (t ? t.title : "")).toLowerCase().indexOf(lq) >= 0; });
    head = '<p class="hint">' + (list.length ? list.length + ' תרגולים' + (list.length > 40 ? ', מוצגים 40 הראשונים. אפשר לדייק את החיפוש' : '') : 'לא נמצא תרגול עם "' + esc(q) + '"') + '</p>';

function mhPickTopic(){

/* ── פעולות. כל אחת משנה את השלב, מציירת, ושומרת. ── */
function mhAct(fn){ var s = mhStep(MH_STEP); fn(s); mhRefresh(); mhSave(s); }
function mhAdd(id){ mhAct(function(s){ if(s.practices.indexOf(id) < 0) s.practices.push(id); }); }
function mhRemove(id){ mhAct(function(s){ s.practices = s.practices.filter(function(x){ return x !== id; }); if(s.starter === id) s.starter = ""; }); }
function mhMove(id, d){ mhAct(function(s){ var a = s.practices, k = a.indexOf(id), j = k + d;
  if(k < 0 || j < 0 || j >= a.length) return; a[k] = a[j]; a[j] = id; }); }
/* התרגול שמתחילים בו עולה לראש הרשימה, כי כך הוא מופיע באתר */
function mhStar(id){ mhAct(function(s){ s.starter = s.starter === id ? "" : id;
  if(s.starter) s.practices = [id].concat(s.practices.filter(function(x){ return x !== id; })); }); }
function mhMonth(m){ mhAct(function(s){ var k = s.months.indexOf(m);
  if(k >= 0) s.months.splice(k, 1); else s.months.push(m);
  s.months.sort(function(a, b){ return MH.months.indexOf(a) - MH.months.indexOf(b); }); }); }
function mhMissing(v){ mhAct(function(s){ s.missing = !!v; }); }
function mhNote(){ var el = $("mhNote"); if(!el) return; var s = mhStep(MH_STEP), v = el.value.trim();
  if(v === (s.note || "")) return; s.note = v; mhSave(s); }
function mhStatus(t, bad){ var el = $("mhStatus"); if(!el) return; el.textContent = t; el.className = "mh-status" + (bad ? " err" : ""); }
function mhSave(s){
  if(MH_SAVE.busy){ MH_SAVE.again = s; mhStatus("שומר..."); return; }
  MH_SAVE.busy = true; mhStatus("שומר...");
  var data = mhCopy(s);
  srv("apiMahalachSave", function(r){
    MH_SAVE.busy = false; s._saved = data; s.by = r.by; s.updated = r.updated;
    if(MH_SAVE.again){ var n = MH_SAVE.again; MH_SAVE.again = null; return mhSave(n); }
    if(MH_STEP === s.i) mhStatus("נשמר ועלה לאתר · " + r.updated);
  }, [auth(), s.i, data], function(e){
    MH_SAVE.busy = false; MH_SAVE.again = null;
    var b = s._saved || {practices:[], starter:"", months:[], missing:false, note:""};
    s.practices = b.practices.slice(); s.starter = b.starter; s.months = b.months.slice(); s.missing = b.missing; s.note = b.note;
    /* מה שנכתב בתיבת ההערה נשאר בה, כדי שאפשר יהיה לשמור שוב ולא לכתוב מחדש */
    if(MH_STEP === s.i){ mhRefresh(); if($("mhMiss")) $("mhMiss").checked = s.missing; }
    mhStatus("לא נשמר: " + (e && e.message ? e.message : e) + " השלב חזר למצב האחרון שנשמר, אפשר לנסות שוב.", true);
  });
}

function renderUsage(){

}
function drawUsage(){
  var d = USE, list = d.people.filter(function(p){ return USE_F === "all" || isTeacher(p); });
  var on = list.filter(function(p){ return p.days > 0; }).sort(function(a,b){ return b.days - a.days || b.used - a.used; });
  var off = list.filter(function(p){ return !p.days; });
  var noLink = off.filter(function(p){ return p.email && !p.linkSent; });
  var h = '<div class="chips" role="group" aria-label="את מי מציגים">' +
    [["teach","מורים ומחנכים"],["all","כל הצוות"]].map(function(x){
      return '<button type="button" class="chip" aria-pressed="'+(USE_F===x[0])+'" onclick="USE_F=\''+x[0]+'\';drawUsage()">'+x[1]+'</button>'; }).join("") + '</div>' +
    '<div class="use-sum"><div><b>'+on.length+'</b><span>נכנסו ב-'+d.days+' הימים האחרונים</span></div>' +
    '<div><b>'+off.length+'</b><span>לא נכנסו</span></div>' +
    '<div><b>'+noLink.length+'</b><span>עוד לא קיבלו קישור</span></div></div>' +
    '<p class="hint">רק כניסה מהקישור האישי מזוהה. ' + (d.anon.devices ? 'עוד '+d.anon.devices+' מכשירים נכנסו בלי קישור אישי.' : 'אין כניסות בלי קישור.') + '</p>';
  if(noLink.length) h += '<div class="row"><button class="btn" onclick="sendUse(null)">שליחת הקישור האישי ל-'+noLink.length+' שעוד לא קיבלו</button></div>';
  h += '<h3>לא נכנסו ('+off.length+')</h3><div>' + (off.length ? off.map(function(p){
      var st = !p.email ? 'אין מייל בתיק הצוות' : (p.linkSent ? 'הקישור נשלח ב-'+esc(p.linkSent) : 'עוד לא קיבל/ה קישור');
      if(p.last) st += ' · נכנס/ה לאחרונה ב-'+heDay(p.last);
      return '<div class="uitem"><div class="bd"><span class="t">'+esc(p.name)+'</span><span class="s">'+esc(p.role)+(p.role?' · ':'')+st+'</span></div>' +
        (p.email ? '<button class="btn3" onclick="sendUse(\''+esc(p.email)+'\')">'+(p.linkSent?'שליחה שוב':'שליחה')+'</button>' : '') + '</div>';
    }).join("") : '<p class="hint">כולם נכנסו.</p>') + '</div>';
  h += '<h3>נכנסו ('+on.length+')</h3><div>' + (on.length ? on.map(function(p){
      var bits = [p.days+' ימים'];
      if(p.open) bits.push(p.open+' פתיחות'); if(p.show) bits.push(p.show+' הקרנות'); if(p.used) bits.push(p.used+' "עשיתי"');
      return '<div class="uitem"><div class="bd"><span class="t">'+esc(p.name)+'</span><span class="s">'+esc(p.role)+(p.role?' · ':'')+'לאחרונה ב-'+heDay(p.last)+'</span>' +
        '<span class="s">'+bits.join(' · ')+'</span>' + (p.top.length ? '<span class="s">בעיקר: '+p.top.map(esc).join(', ')+'</span>' : '') + '</div></div>';
    }).join("") : '<p class="hint">עוד אף אחד/ת.</p>') + '</div>';
  if(d.top.length) h += '<h3>התרגולים שהכי משתמשים בהם</h3><div>' + d.top.map(function(t){
      var bits = []; if(t.used) bits.push(t.used+' "עשיתי"'); if(t.show) bits.push(t.show+' הקרנות'); if(t.open) bits.push(t.open+' פתיחות');
      return '<div class="uitem"><div class="bd"><span class="t">'+esc(t.title)+'</span><span class="s">'+bits.join(' · ')+' · '+t.people+' אנשי צוות</span></div></div>'; }).join("") + '</div>';
  h += '<div class="row"><a class="btn3" style="display:inline-flex;align-items:center;text-decoration:none" href="'+esc(d.sheetUrl)+'" target="_blank">כל הרישומים בגיליון</a></div>';
  $("use").innerHTML = h;
}
function sendUse(email){
  var list = email ? [email] : USE.people.filter(function(p){ return (USE_F === "all" || isTeacher(p)) && !p.days && p.email && !p.linkSent; }).map(function(p){ return p.email; });
  var txt = email ? "יישלח מייל עם הקישור האישי לאתר." :
    "יישלח מייל ל-"+list.length+" אנשי צוות, לכל אחד/ת הקישור האישי שלו/ה לאתר. במייל כתוב שהקישור מזהה אותם, כדי שנדע באילו תרגולים משתמשים.";
  askConfirm(txt, function(){
    showOk("שולח...");
    srv("apiSendUseLinks", function(r){ showOk("נשלחו "+r.sent+" מיילים."); renderUsage(); }, [auth(), list]);
  }, {yes:"שליחה"});
}

/* ── קישורים אישיים, לשחף בלבד ─────────────────────────────── */
function showLinks(){ srv("apiLinks", renderLinks, [auth()]); }
function renderLinks(d){
  var h = '<p class="hint" style="margin-top:10px">כל איש צוות יכול לבקש קישור למייל שלו במסך הכניסה. ' +
          'אלה הקישורים של הצוות המוביל, למקרה שצריך לשלוח אותם ידנית.</p>';
  d.people.forEach(function(p){
    h += '<div class="lnk"><strong>'+esc(p.name)+'</strong><br>'+esc(p.url)+
         '<div class="row" style="margin-top:6px"><button class="btn3" onclick="cp(\''+p.url+'\')">העתקה</button>' +
         '<button class="btn3" onclick="cp(\''+p.tichnunUrl+'\')">קישור לתכנון השבועות</button></div></div>';
  });
  h += '<div class="row"><button class="btn3" onclick="sendTichnunLinks()">שליחת קישור התכנון במייל לארבע הנכנסות</button></div>';
  h += '<div class="lnk">כתובת המערכת לשליחה לצוות: '+esc(d.base)+'</div>' +
       '<div class="row"><a class="btn3" style="display:inline-flex;align-items:center;text-decoration:none" href="'+esc(d.sheetUrl)+'" target="_blank">הגיליון</a>' +
       '<a class="btn3" style="display:inline-flex;align-items:center;text-decoration:none" href="'+esc(d.folderUrl)+'" target="_blank">תיקיית הקבצים</a></div>';
  $("links").innerHTML = h;
}
function sendTichnunLinks(){
  askConfirm("לשלוח לחן, עדי, שני ואילנה מייל אישי עם הקישור שלהן לתכנון השבועות? המייל חתום בשמך.", function(){
    srv("apiSendTichnunLinks", function(r){ showOk("נשלח ל: " + r.sent.join(", ") + "."); }, [auth()]);
  });
}
function cp(t){ navigator.clipboard.writeText(t).then(function(){ showOk("הועתק."); }); }

/* ── פידבק על תרגולים, לצוות המוביל ──────────────────────────── */
var FBK = null, FBK_S = "used";
function renderFeedback(){
  $("pane").innerHTML = '<div class="card"><h2>פידבק וקליקים על התרגולים</h2><div id="fbk">רגע, סופר...</div><div class="msg" id="msg" hidden></div></div>';
  srv("apiFeedbackBoard", function(d){ FBK = d; drawFeedback(); }, [auth()]);
}
function drawFeedback(){
  var d = FBK;
  if(!d.total && !d.items.length){ $("fbk").innerHTML = '<p class="hint">עוד אין נתונים. הפידבק נאסף בטופס שבסוף כל תרגול באתר הפנקס, והקליקים נספרים מהכניסות לאתר.</p>'; return; }
  var items = d.items.slice().sort(function(a,b){
    if(FBK_S === "avg") return (b.avg||0) - (a.avg||0) || b.used - a.used;
    if(FBK_S === "used") return b.used - a.used || b.n - a.n;
    if(FBK_S === "clicks") return (b.clicks||0) - (a.clicks||0) || b.n - a.n;
    return b.n - a.n; });
  var h = '<div class="chips" role="group" aria-label="מיון">' +
    [["used","לפי כמה השתמשו"],["clicks","לפי קליקים"],["avg","לפי דירוג"],["n","לפי מספר תשובות"]].map(function(x){
      return '<button type="button" class="chip" aria-pressed="'+(FBK_S===x[0])+'" onclick="FBK_S=\''+x[0]+'\';drawFeedback()">'+x[1]+'</button>'; }).join("") + '</div>' +
    '<div class="use-sum">' +
    [["used",d.used,'"השתמשתי"'],["n",d.total,"תשובות"],["avg",(d.avgAll ? d.avgAll.toFixed(1) : "·"),"דירוג ממוצע ("+d.ratedN+")"]].map(function(x){
      return '<button type="button" class="sumbtn" aria-pressed="'+(FBK_S===x[0])+'" onclick="FBK_S=\''+x[0]+'\';drawFeedback()"><b>'+x[1]+'</b><span>'+x[2]+'</span></button>'; }).join("") + '</div>' +
    '<p class="hint">הפידבק אנונימי. תרגול עם פחות מ-'+d.minGroup+' תשובות, או פחות מ-'+d.minGroup+' דירוגים, לא מוצג בנפרד כדי לשמור על האנונימיות.</p>';
  h += items.length ? items.map(function(t){
    var bits = [t.n+' תשובות', t.used+' השתמשו'];
    if(t.notyet) bits.push(t.notyet+' עוד לא'); if(t.na) bits.push(t.na+' לא מתאים');
    var ck = [];
    if(t.open) ck.push(t.open+' פתיחות'); if(t.show) ck.push(t.show+' הקרנות'); if(t.did) ck.push(t.did+' "עשיתי"');
    return '<div class="uitem"><div class="bd"><span class="t">'+esc(t.title)+(t.avg ? ' · '+t.avg.toFixed(1)+' ★' : '')+'</span>' +
      '<span class="s">'+(ck.length ? 'ב-'+d.days+' הימים האחרונים: '+ck.join(' · ') : 'אין קליקים ב-'+d.days+' הימים האחרונים')+'</span>' +
      (t.n ? '<span class="s">'+bits.join(' · ')+'</span>' : '') +
      t.notes.map(function(x){ return '<span class="s">• '+esc(x)+'</span>'; }).join("") + '</div></div>';
  }).join("") : '<p class="hint">עוד אין תרגול עם מספיק תשובות להצגה נפרדת.</p>';
  if(d.small){
    h += '<p class="hint">עוד '+d.small+' תשובות על תרגולים עם פחות מ-'+d.minGroup+' תשובות כל אחד נספרות בסיכום בלבד.</p>';
    if(d.smallNotes.length) h += '<h3>הערות נוספות</h3>' + d.smallNotes.map(function(x){ return '<p class="s">• '+esc(x)+'</p>'; }).join("");
  }
  h += '<div class="row"><a class="btn3" style="display:inline-flex;align-items:center;text-decoration:none" href="'+esc(d.sheetUrl)+'" target="_blank">הגיליון המלא</a></div>';
  $("fbk").innerHTML = h;
}

/* ── הגדרות, לשחף בלבד ─────────────────────────────────────── */
function renderSettings(){
  $("pane").innerHTML = '<div class="card"><h2>סיסמת הצוות המוביל</h2>' +
    '<p class="sub">סיסמה אחת משותפת לחמש הנכנסות. החלפה מנתקת את כולן והן יזינו את החדשה. כדאי לשלוח אותה בהודעה אישית, לא במייל.</p>' +
    '<label class="f">סיסמה חדשה (8 תווים לפחות)<input type="text" id="npw" autocomplete="off"></label>' +
    '<div class="row"><button class="btn" onclick="setPw()">שמירת הסיסמה</button></div>' +
    '<div class="msg" id="msg" hidden></div></div>' +
    '<div class="card"><h2>פידבק אנונימי מהצוות</h2>' +
    '<p class="sub">דוח עם סיכום הפידבק על התרגולים יוצא אוטומטית אחת לשבועיים לכל הצוות המוביל, רק כשיש תשובות חדשות. אפשר לשלוח אותו עכשיו.</p>' +
    '<div class="row"><button class="btn2" onclick="sendReport()">שליחת הדוח עכשיו</button></div>' +
    '<div class="msg" id="msg3" hidden></div></div>';
}
function setPw(){
  var v = $("npw").value;
  if(v.length < 8){ showErr({message:"הסיסמה צריכה להיות באורך 8 תווים לפחות."}); return; }
  srv("apiSetPassword", function(){
    notify("הסיסמה נשמרה. כל הכניסות נותקו, וגם שלך. היכנסי מחדש עם הסיסמה החדשה.", {title:"נשמר", then:function(){ endSession(); }});
  }, [auth(), v]);
}
function sendReport(){
  var m = $("msg3"); m.hidden = false; m.className = "msg ok"; m.textContent = "שולח...";
  srv("apiFeedbackReport", function(r){
    m.className = "msg ok"; m.textContent = r.sent ? "הדוח נשלח." : "לא נשלח: " + (r.why || "");
  }, [auth()], function(e){ m.className = "msg err"; m.textContent = e.message; });
}

boot();
</script>
</body>
</html>
