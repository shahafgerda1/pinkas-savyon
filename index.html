<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פנקס התרגולים — סביון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Varela+Round&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#2b2b2b; --muted:#6b6b6b;
    --line:#e6e1d6; --accent:#3aa66f; --shadow:0 2px 10px rgba(0,0,0,.06);
    --radius:16px; --display:"Varela Round","Heebo",system-ui,sans-serif;
    --purple:#5e2b91;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Heebo",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  .brand,h1.page,.world-h h2,.tcard h3,.pbody h4{font-family:var(--display)}
  .crumbs .cw{color:var(--purple);font-weight:700}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;background:#efeae0;color:#3a3a3a;transition:.15s}
  button:hover{filter:brightness(.97)}
  button.primary{background:var(--accent);color:#fff}
  button.ghost{background:transparent;border:1px solid var(--line)}
  button.danger{background:#fbe7ea;color:#b32a44}
  button.sm{padding:5px 10px;font-size:12.5px}
  input,textarea,select{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:64px;line-height:1.5}
  header.top{position:sticky;top:0;z-index:20;background:rgba(244,241,234,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top-in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
  .brand-logo{height:38px;width:38px;object-fit:contain;border-radius:9px;display:block}
  .grow{flex:1}
  .search{min-width:180px;max-width:280px}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 70px}
  .crumbs{font-size:13.5px;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .crumbs a{cursor:pointer;text-decoration:none;border-bottom:1px dashed transparent}
  .crumbs a:hover{border-color:var(--muted)}
  .back{margin:0 0 12px;background:var(--purple);color:#fff;font-family:var(--display);font-size:14.5px;padding:9px 18px;border-radius:999px;box-shadow:0 3px 10px rgba(94,43,145,.22)}
  .back:hover{filter:brightness(1.08)}
  h1.page{font-size:26px;margin:.1em 0 .15em}
  .lead{color:var(--muted);font-size:15px;max-width:760px;line-height:1.55;margin:0 0 18px}
  /* world section */
  .world{margin:0 0 30px}
  .world-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
  .world-h .bar{width:10px;height:24px;border-radius:5px}
  .world-h h2{font-size:18px;margin:0}
  .world-h .count{font-size:12.5px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;position:relative;display:flex;flex-direction:column;gap:7px;border-top:5px solid var(--accent)}
  .tcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.09)}
  .tcard h3{margin:0;font-size:16.5px;line-height:1.35}
  .tcard p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tcard .meta{margin-top:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .pill{background:#f0ece2;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
  /* practice cards */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .thumb{background:#faf8f3;border-bottom:1px solid var(--line);height:240px;display:flex;align-items:center;justify-content:center;cursor:zoom-in;overflow:hidden}
  .thumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px}
  .pbody .badge{align-self:flex-start;background:#eef4ff;color:#3a5bbf;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px}
  .pbody .badge.file{background:#efe6fb;color:#6a2c91}
  .thumb.is-file{cursor:pointer;position:relative}
  .thumb .play{position:absolute;inset:0;margin:auto;width:54px;height:54px;display:flex;align-items:center;justify-content:center;background:rgba(94,43,145,.85);color:#fff;border-radius:50%;font-size:20px;padding-right:4px;pointer-events:none;box-shadow:0 3px 12px rgba(0,0,0,.25)}
  .open-file{display:inline-block;align-self:flex-start;margin-top:2px;background:var(--purple);color:#fff;border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;text-decoration:none}
  .open-file:hover{filter:brightness(1.1)}
  .pbody h4{margin:0;font-size:15px;line-height:1.35}
  .pbody .expl{font-size:13px;color:#555;line-height:1.55;margin:0}
  .editrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .editrow .spacer{flex:1}
  .field-lbl{font-size:11.5px;color:var(--muted);font-weight:600;margin:2px 0 -2px}
  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(20,18,14,.86);z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px}
  .lb.open{display:flex}
  .lb img{max-width:94vw;max-height:78vh;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff}
  .lb .cap{color:#fff;text-align:center;max-width:760px;font-size:14px;line-height:1.5}
  .lb .nav{display:flex;gap:12px;align-items:center}
  .lb button{background:#ffffff20;color:#fff;border:1px solid #ffffff44}
  .lb .x{position:absolute;top:16px;left:16px}
  .empty{color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center}
  .toolbar-edit{background:#fff7e6;border:1px solid #f0e2c0;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:13.5px;color:#7a5d1d;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  @media(max-width:560px){.thumb{height:200px}.top-in{padding:10px 12px}.wrap{padding:16px 12px 60px}}
  .hidden{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><img class="brand-logo" src="images/logo.png" alt="בית ספר סביון" onerror="this.style.display='none'"><span id="brandTitle">פנקס התרגולים</span></div>
    <div class="grow"></div>
    <input id="search" class="search" placeholder="חיפוש תרגול או נושא…">
    <button id="btnEdit" class="ghost">✏️ עריכה</button>
    <button id="btnExport" class="ghost sm">⬇️ גיבוי</button>
    <button id="btnImport" class="ghost sm">⬆️ שחזור</button>
    <button id="btnReset" class="ghost sm">↺ איפוס</button>
    <input id="importFile" type="file" accept="application/json" class="hidden">
  </div>
</header>

<div class="wrap" id="app"></div>

<div class="lb" id="lightbox">
  <button class="x" id="lbClose">✕ סגירה</button>
  <img id="lbImg" src="" alt="">
  <div class="cap" id="lbCap"></div>
  <div class="nav">
    <button id="lbPrev">→ הקודם</button>
    <button id="lbNext">הבא ←</button>
  </div>
</div>

<script src="data.js"></script>
<script>
const LS_KEY = "savyon_practices_v1";
let DATA, edit=false, view={name:"home"}, q="";
let lb={list:[],i:0};

function clone(o){return JSON.parse(JSON.stringify(o));}
function load(){ const s=localStorage.getItem(LS_KEY); DATA = s?JSON.parse(s):clone(window.SEED_DATA); migrate(); }
function pageLoc(pg){ for(const t of DATA.topics){ const i=t.practices.findIndex(p=>p.page===pg); if(i>=0) return {t,i}; } return null; }
function migrate(){
  let changed=false;
  if((DATA.version||1) < 2){
    [1,3].forEach(pg=>{ const o=pageLoc(pg); if(o){ o.t.practices.splice(o.i,1); changed=true; } });
    const tgt=DATA.topics.find(t=>t.id==="t15");
    [43,44].forEach(pg=>{ const o=pageLoc(pg); if(o && tgt){ const [p]=o.t.practices.splice(o.i,1);
      p.title="דף איור / צביעה — השפה שלי";
      p.explanation="דף ויזואלי נלווה לנושא הדיבור והשיח הפנימי — 'השפה שלי'.";
      tgt.practices.push(p); changed=true; } });
    if(tgt) tgt.practices.sort((a,b)=>(a.page||9999)-(b.page||9999));
    DATA.version=2; changed=true;
  }
  if((DATA.version||1) < 3){
    const t=DATA.topics.find(x=>x.id==="t26");
    if(t && !t.practices.some(p=>p.file)){
      [["prez1","מצגת: הקשבה אקטיבית — מערך כיתתי","images/prez-1.jpg","מצגת/הקשבה-1.pdf","מערך תרגול כיתתי לאימון 'כוח-על' של הקשבה אקטיבית — ללמוד להקשיב באמת (10 שקופיות)."],
       ["prez2","מצגת: בוקר של הקשבה — מערך כיתתי","images/prez-2.jpg","מצגת/הקשבה-2.pdf","מערך תרגול כיתתי לפתיחת היום בהקשבה — 'בוקר של הקשבה' (13 שקופיות)."],
       ["prez3","מצגת: בוקר של הקשבה — מדריך מעשי","images/prez-3.jpg","מצגת/הקשבה-3.pdf","מדריך מעשי לפיתוח נוכחות והקשבה — 'בוקר של הקשבה' (10 שקופיות)."]]
      .forEach(([id,title,img,file,explanation])=>t.practices.push({id,page:null,img,title,explanation,file}));
      changed=true;
    }
    DATA.version=3; changed=true;
  }
  if((DATA.version||1) < 4){
    const add=(tid,arr)=>{ const t=DATA.topics.find(x=>x.id===tid); if(!t) return;
      arr.forEach(([id,title,img,file,explanation])=>{ if(!t.practices.some(p=>p.id===id)){
        t.practices.push({id,page:null,img,title,explanation,file}); changed=true; } }); };
    add("t17",[
      ["effort1","מצגת: מתרגלים מאמץ נכון","images/prez-effort-1.jpg","מצגת/מאמץ-נכון-1.pdf","בוקר של תרגול מאמץ נכון — שמירה על הכוחות שלנו ביחד עד למסיבת הסיום (9 שקופיות)."],
      ["effort2","מצגת: מתרגלים מאמץ נכון — אינטראקטיבית","images/prez-effort-2.jpg","מצגת/מאמץ-נכון-2.pdf","גרסה אינטראקטיבית לתרגול מאמץ נכון, עם 'לחצו להתחלה' (9 שקופיות)."]]);
    add("t20",[
      ["joy1","מצגת: ציידי רגעי השמחה (Joy Moments)","images/prez-joy-1.jpg","מצגת/רגעי-שמחה-1.pdf","מאמנים את המוח לזהות רגעי שמחה — 'ציידות וציידי רגעי השמחה' (8 שקופיות)."],
      ["joy2","מצגת: ציידי רגעי השמחה — מדריך שטח (בוגרת)","images/prez-joy-2.jpg","מצגת/רגעי-שמחה-בוגרת.pdf","מדריך שטח לחיווט מחדש של המוח לזיהוי שמחה — גרסה לבוגרות/בוגרים (9 שקופיות)."]]);
    DATA.version=4; changed=true;
  }
  if((DATA.version||1) < 5){
    let tla=DATA.topics.find(x=>x.id==="tla");
    if(!tla){
      tla={id:"tla",title:"קשב לאחר",world:"w6",description:"מצגות כיתתיות לתרגול הקשבה והקשבה לאחֵר — 'הקשבה לאחר'.",practices:[]};
      const i=DATA.topics.findIndex(x=>x.id==="t26");
      DATA.topics.splice(i>=0?i+1:DATA.topics.length,0,tla); changed=true;
    }
    ["prez1","prez2","prez3"].forEach(pid=>{
      for(const t of DATA.topics){ if(t.id==="tla") continue;
        const idx=t.practices.findIndex(p=>p.id===pid);
        if(idx>=0){ const [p]=t.practices.splice(idx,1); tla.practices.push(p); changed=true; break; } }
    });
    DATA.version=5; changed=true;
  }
  if((DATA.version||1) < 6){
    let topen=DATA.topics.find(x=>x.id==="topen");
    if(!topen){
      topen={id:"topen",title:"גישה מקבלת ופתוחה",world:"w3",description:"גישה של קבלה, גמישות ופתיחוּת לרגע — להיות חברים של מה שיש. מצגות בגרסאות לפי גיל.",practices:[]};
      const i=DATA.topics.findIndex(x=>x.id==="t18");
      DATA.topics.splice(i>=0?i+1:DATA.topics.length,0,topen); changed=true;
    }
    [["open1","מצגת: הלב המקבל (צעירים)","images/prez-open-young.jpg","מצגת/גישה-מקבלת-צעירים.pdf","לומדים להיות חברים של הרגע הזה — גישה מקבלת ופתוחה, גרסה לצעירים (11 שקופיות)."],
     ["open2","מצגת: גמישות כמו במבוק (ביניים)","images/prez-open-middle.jpg","מצגת/גישה-מקבלת-ביניים.pdf","הכוח של הגישה הפתוחה — גמישות כמו במבוק, גרסה לביניים (13 שקופיות)."],
     ["open3","מצגת: הבית הפנימי שלנו (חטיבה)","images/prez-open-junior.jpg","מצגת/גישה-מקבלת-חטיבה.pdf","למצוא שקט במרחב הבחירה דרך קבלה ונוכחות — גרסה לחטיבה (9 שקופיות)."]]
      .forEach(([id,title,img,file,explanation])=>{ if(!topen.practices.some(p=>p.id===id)){ topen.practices.push({id,page:null,img,title,explanation,file}); changed=true; } });
    DATA.version=6; changed=true;
  }
  if((DATA.version||1) < 7){
    const t=DATA.topics.find(x=>x.id==="tla");
    if(t){
      [["lafter1","מצגת: קשב לאחר (בית הצעירים)","images/prez-la-young.jpg","מצגת/קשב-לאחר-צעירים.pdf","מצגת לתרגול הקשבה לאחֵר — גרסה לבית הצעירים (11 שקופיות)."],
       ["lafter2","מצגת: קשב לאחר (ביניים וחטיבה)","images/prez-la-mid.jpg","מצגת/קשב-לאחר-ביניים-חטיבה.pdf","מצגת לתרגול הקשבה לאחֵר — גרסה לבית ביניים וחטיבה (10 שקופיות)."]]
      .forEach(([id,title,img,file,explanation])=>{ if(!t.practices.some(p=>p.id===id)){ t.practices.push({id,page:null,img,title,explanation,file}); changed=true; } });
    }
    DATA.version=7; changed=true;
  }
  if(changed) save();
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }
  catch(e){ alert("⚠️ לא הצלחתי לשמור את השינויים — ייתכן שאחסון הדפדפן מלא.\nכדאי לעשות גיבוי (⬇️) ולמחוק פריטים כבדים שאינם בשימוש."); }
}
function world(id){ return DATA.worlds.find(w=>w.id===id)||DATA.worlds[0]; }
function topic(id){ return DATA.topics.find(t=>t.id===id); }
function uid(p){ return p+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

/* ---------- rendering ---------- */
const app = document.getElementById("app");

function render(){
  document.getElementById("brandTitle").textContent = DATA.appTitle || "פנקס התרגולים";
  document.getElementById("btnEdit").textContent = edit ? "✓ סיום עריכה" : "✏️ עריכה";
  document.getElementById("btnEdit").className = edit ? "primary" : "ghost";
  if(q.trim()){ renderSearch(); return; }
  if(view.name==="home") renderHome();
  else if(view.name==="topic") renderTopic(view.id);
}

function renderHome(){
  let total = DATA.topics.reduce((a,t)=>a+t.practices.length,0);
  let h = `<h1 class="page">נושאים לתרגול</h1>
    <p class="lead">${DATA.topics.length} נושאים · ${total} תרגולים. לחצי על נושא כדי לראות את התרגולים שבו, התמונות וההסבר.</p>`;
  if(edit){
    h += `<div class="toolbar-edit">מצב עריכה פעיל — אפשר לשנות שמות, הסברים, להעביר תרגולים בין נושאים, להוסיף ולמחוק.
      <span class="spacer" style="flex:1"></span>
      <button class="primary sm" onclick="addTopic()">＋ נושא חדש</button></div>`;
  }
  for(const w of DATA.worlds){
    const ts = DATA.topics.filter(t=>t.world===w.id);
    if(!ts.length && !edit) continue;
    const cnt = ts.reduce((a,t)=>a+t.practices.length,0);
    h += `<section class="world">
      <div class="world-h"><span class="bar" style="background:${w.color}"></span>
        <h2>${esc(w.title)}</h2><span class="count">${ts.length} נושאים · ${cnt} תרגולים</span></div>
      <div class="grid">`;
    for(const t of ts){ h += topicCard(t,w); }
    h += `</div></section>`;
  }
  app.innerHTML = h;
}

function topicCard(t,w){
  let ctrls = "";
  if(edit){
    ctrls = `<div class="editrow" onclick="event.stopPropagation()">
      <button class="sm ghost" onclick="moveTopic('${t.id}',-1)">▲</button>
      <button class="sm ghost" onclick="moveTopic('${t.id}',1)">▼</button>
      <span class="spacer"></span>
      <button class="sm danger" onclick="delTopic('${t.id}')">מחיקה</button></div>`;
  }
  return `<div class="tcard" style="border-top-color:${w.color}" onclick="openTopic('${t.id}')">
    <h3>${esc(t.title)}</h3>
    <p>${esc(t.description)}</p>
    <div class="meta"><span class="pill">${t.practices.length} תרגולים</span><span>${esc(w.title)}</span></div>
    ${ctrls}
  </div>`;
}

function renderTopic(id){
  const t = topic(id); if(!t){ view={name:"home"}; return render(); }
  const w = world(t.world);
  let h = `<button class="back" onclick="goHome()">→ חזרה לכל הנושאים</button>
    <div class="crumbs"><a onclick="goHome()">כל הנושאים</a> ‹ <span class="cw">${esc(w.title)}</span> ‹ <span>${esc(t.title)}</span></div>`;
  if(edit){
    let wopts = DATA.worlds.map(x=>`<option value="${x.id}" ${x.id===t.world?"selected":""}>${esc(x.title)}</option>`).join("");
    h += `<div class="toolbar-edit" style="display:block">
        <div class="field-lbl">שם הנושא</div>
        <input value="${esc(t.title)}" onchange="setTopic('${t.id}','title',this.value)">
        <div class="field-lbl" style="margin-top:8px">הסבר על הנושא</div>
        <textarea onchange="setTopic('${t.id}','description',this.value)">${esc(t.description)}</textarea>
        <div class="field-lbl" style="margin-top:8px">עולם</div>
        <select onchange="setTopic('${t.id}','world',this.value)">${wopts}</select>
      </div>`;
  } else {
    h += `<h1 class="page" style="border-right:6px solid ${w.color};padding-right:12px">${esc(t.title)}</h1>
          <p class="lead">${esc(t.description)}</p>`;
  }
  if(!t.practices.length){
    h += `<div class="empty">אין עדיין תרגולים בנושא זה.</div>`;
  } else {
    h += `<div class="pgrid">`;
    t.practices.forEach((p,idx)=>{ h += practiceCard(t,p,idx); });
    h += `</div>`;
  }
  if(edit){
    h += `<div style="margin-top:18px"><button class="primary" onclick="document.getElementById('addImg_${t.id}').click()">＋ הוספת תרגול (תמונה)</button>
      <input id="addImg_${t.id}" type="file" accept="image/*" class="hidden" onchange="addPractice('${t.id}',this)">
      <div class="hint">הוספת תרגול חדש: בחרי קובץ תמונה מהמחשב — היא תישמר בתוך האפליקציה.</div></div>`;
  }
  app.innerHTML = h;
}

function practiceCard(t,p,idx){
  const isFile = !!p.file;
  const badge = isFile ? "📑 מצגת" : (p.page ? `עמ' ${p.page}` : "תרגול");
  const fileUrl = isFile ? encodeURI(p.file) : "";
  const thumbClick = isFile ? `window.open('${fileUrl}','_blank')` : `openLb('${t.id}',${idx})`;
  const playIcon = isFile ? '<span class="play">▶</span>' : '';
  if(!edit){
    return `<div class="pcard">
      <div class="thumb${isFile?' is-file':''}" onclick="${thumbClick}"><img loading="lazy" src="${encodeURI(p.img)}" alt="${esc(p.title)}">${playIcon}</div>
      <div class="pbody">
        <span class="badge${isFile?' file':''}">${badge}</span>
        <h4>${esc(p.title)}</h4>
        <p class="expl">${esc(p.explanation)}</p>
        ${isFile?`<a class="open-file" href="${fileUrl}" target="_blank" rel="noopener">📑 פתיחת המצגת</a>`:''}
      </div></div>`;
  }
  const topicOpts = DATA.topics.map(x=>`<option value="${x.id}" ${x.id===t.id?"selected":""}>${esc(x.title)}</option>`).join("");
  return `<div class="pcard">
    <div class="thumb${isFile?' is-file':''}" onclick="${thumbClick}"><img loading="lazy" src="${encodeURI(p.img)}" alt="">${playIcon}</div>
    <div class="pbody">
      <div class="editrow"><span class="badge${isFile?' file':''}">${badge}</span><span class="spacer"></span>
        <button class="sm ghost" onclick="movePractice('${t.id}','${p.id}',-1)">▲</button>
        <button class="sm ghost" onclick="movePractice('${t.id}','${p.id}',1)">▼</button>
      </div>
      <div class="field-lbl">כותרת</div>
      <input value="${esc(p.title)}" onchange="setPractice('${t.id}','${p.id}','title',this.value)">
      <div class="field-lbl">הסבר</div>
      <textarea onchange="setPractice('${t.id}','${p.id}','explanation',this.value)">${esc(p.explanation)}</textarea>
      <div class="field-lbl">העברה לנושא</div>
      <select onchange="reassign('${t.id}','${p.id}',this.value)">${topicOpts}</select>
      <div class="editrow">
        <button class="sm ghost" onclick="document.getElementById('rep_${p.id}').click()">החלפת תמונה</button>
        <input id="rep_${p.id}" type="file" accept="image/*" class="hidden" onchange="replaceImg('${t.id}','${p.id}',this)">
        <span class="spacer"></span>
        <button class="sm danger" onclick="delPractice('${t.id}','${p.id}')">מחיקה</button>
      </div>
    </div></div>`;
}

function renderSearch(){
  const query = q.trim().toLowerCase();
  const res=[];
  for(const t of DATA.topics){
    t.practices.forEach((p,idx)=>{
      if((p.title+" "+p.explanation+" עמ' "+(p.page||"")).toLowerCase().includes(query))
        res.push({t,p,idx});
    });
  }
  const tmatch = DATA.topics.filter(t=>(t.title+" "+t.description).toLowerCase().includes(query));
  let h = `<h1 class="page">תוצאות חיפוש</h1><p class="lead">${res.length} תרגולים · ${tmatch.length} נושאים תואמים ל"${esc(q.trim())}".</p>`;
  if(tmatch.length){
    h += `<div class="grid" style="margin-bottom:24px">`;
    for(const t of tmatch) h += topicCard(t, world(t.world));
    h += `</div>`;
  }
  if(res.length){
    h += `<div class="pgrid">`;
    for(const r of res){
      const p=r.p, isFile=!!p.file, fileUrl=isFile?encodeURI(p.file):"";
      const click=isFile?`window.open('${fileUrl}','_blank')`:`openLbFrom('${r.t.id}',${r.idx})`;
      h += `<div class="pcard">
        <div class="thumb${isFile?' is-file':''}" onclick="${click}"><img loading="lazy" src="${encodeURI(p.img)}" alt="">${isFile?'<span class="play">▶</span>':''}</div>
        <div class="pbody"><span class="badge${isFile?' file':''}">${esc(r.t.title)}</span><h4>${esc(p.title)}</h4>
        <p class="expl">${esc(p.explanation)}</p>
        ${isFile?`<a class="open-file" href="${fileUrl}" target="_blank" rel="noopener">📑 פתיחת המצגת</a>`:''}</div></div>`;
    }
    h += `</div>`;
  }
  if(!res.length && !tmatch.length) h += `<div class="empty">לא נמצאו תוצאות.</div>`;
  app.innerHTML = h;
}

/* ---------- navigation ---------- */
function goHome(){ view={name:"home"}; window.scrollTo(0,0); render(); }
function openTopic(id){ view={name:"topic",id}; window.scrollTo(0,0); render(); }

/* ---------- edits ---------- */
function setTopic(id,k,v){ const t=topic(id); t[k]=v; save(); if(k==="world"){render();} }
function setPractice(tid,pid,k,v){ const t=topic(tid); t.practices.find(p=>p.id===pid)[k]=v; save(); }
function moveTopic(id,d){ const i=DATA.topics.findIndex(t=>t.id===id); const j=i+d; if(j<0||j>=DATA.topics.length)return; [DATA.topics[i],DATA.topics[j]]=[DATA.topics[j],DATA.topics[i]]; save(); render(); }
function movePractice(tid,pid,d){ const t=topic(tid); const i=t.practices.findIndex(p=>p.id===pid); const j=i+d; if(j<0||j>=t.practices.length)return; [t.practices[i],t.practices[j]]=[t.practices[j],t.practices[i]]; save(); render(); }
function reassign(tid,pid,target){ if(target===tid)return; const t=topic(tid); const i=t.practices.findIndex(p=>p.id===pid); const [p]=t.practices.splice(i,1); topic(target).practices.push(p); save(); render(); }
function delPractice(tid,pid){ if(!confirm("למחוק את התרגול?"))return; const t=topic(tid); t.practices=t.practices.filter(p=>p.id!==pid); save(); render(); }
function delTopic(id){ const t=topic(id); if(!confirm(`למחוק את הנושא "${t.title}" על ${t.practices.length} התרגולים שבו?`))return; DATA.topics=DATA.topics.filter(x=>x.id!==id); save(); render(); }
function addTopic(){ DATA.topics.unshift({id:uid("t"),title:"נושא חדש",world:DATA.worlds[0].id,description:"",practices:[]}); save(); render(); }
function fileToData(input,cb){ const f=input.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(f); input.value=""; }
function addPractice(tid,input){ fileToData(input,d=>{ topic(tid).practices.push({id:uid("p"),page:null,img:d,title:"תרגול חדש",explanation:""}); save(); render(); }); }
function replaceImg(tid,pid,input){ fileToData(input,d=>{ topic(tid).practices.find(p=>p.id===pid).img=d; save(); render(); }); }

/* ---------- lightbox ---------- */
function openLb(tid,idx){ const t=topic(tid);
  const clickedId=t.practices[idx]&&t.practices[idx].id;
  const imgs=t.practices.filter(p=>!p.file);
  lb.list=imgs.map(p=>({img:p.img,title:p.title,expl:p.explanation,page:p.page}));
  lb.i=Math.max(0, imgs.findIndex(p=>p.id===clickedId));
  showLb(); }
function openLbFrom(tid,idx){ openTopic(tid); setTimeout(()=>openLb(tid,idx),0); }
function showLb(){ const it=lb.list[lb.i]; if(!it)return; document.getElementById("lbImg").src=it.img;
  document.getElementById("lbCap").innerHTML=`<b>${esc(it.title)}</b>${it.page?` · עמ' ${it.page}`:""}<br>${esc(it.expl)}`;
  document.getElementById("lightbox").classList.add("open"); }
function lbStep(d){ lb.i=(lb.i+d+lb.list.length)%lb.list.length; showLb(); }
function closeLb(){ document.getElementById("lightbox").classList.remove("open"); }

/* ---------- backup ---------- */
function dateStamp(){ const d=new Date(), p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
async function exportData(){
  const json=JSON.stringify(DATA,null,2);
  const fname=`פנקס-תרגולים-גיבוי-${dateStamp()}.json`;
  // 1) שרת מקומי: שמירה אוטומטית לתיקיית "גיבויים" שבפרויקט
  if(location.protocol.startsWith("http")){
    try{
      const res=await fetch("/save-backup",{method:"POST",headers:{"Content-Type":"application/json"},body:json});
      if(res.ok){ const r=await res.json(); alert("✅ הגיבוי נשמר אוטומטית בתיקיית הגיבויים:\n"+(r.file||fname)); return; }
    }catch(e){ /* אין שרת — נמשיך לאפשרויות הבאות */ }
  }
  // 2) בחירת תיקייה בדפדפן (אם נתמך)
  if(window.showSaveFilePicker){
    try{
      const handle=await window.showSaveFilePicker({ suggestedName:fname,
        types:[{description:"גיבוי פנקס",accept:{"application/json":[".json"]}}] });
      const w=await handle.createWritable(); await w.write(json); await w.close();
      alert("✅ הגיבוי נשמר במקום שבחרת:\n"+handle.name); return;
    }catch(e){ if(e && e.name==="AbortError") return; }
  }
  // 3) הורדה רגילה לתיקיית ההורדות (עם תאריך בשם)
  const blob=new Blob([json],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname; a.click();
}
function importData(input){ const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.topics)throw 0; DATA=d; migrate(); save(); goHome(); alert("הגיבוי שוחזר בהצלחה."); }
    catch(e){ alert("הקובץ אינו תקין."); } }; r.readAsText(f); input.value=""; }
function resetData(){ if(!confirm("לאפס לכל התוכן המקורי? כל השינויים שלך יימחקו."))return; localStorage.removeItem(LS_KEY); load(); goHome(); }

/* ---------- wire up ---------- */
document.getElementById("btnEdit").onclick=()=>{ edit=!edit; render(); };
document.getElementById("btnExport").onclick=exportData;
document.getElementById("btnImport").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=function(){ importData(this); };
document.getElementById("btnReset").onclick=resetData;
document.getElementById("search").oninput=function(){ q=this.value; render(); };
document.getElementById("lbClose").onclick=closeLb;
document.getElementById("lbPrev").onclick=()=>lbStep(-1);
document.getElementById("lbNext").onclick=()=>lbStep(1);
document.getElementById("lightbox").onclick=e=>{ if(e.target.id==="lightbox")closeLb(); };
document.addEventListener("keydown",e=>{ if(!document.getElementById("lightbox").classList.contains("open"))return;
  if(e.key==="Escape")closeLb(); if(e.key==="ArrowRight")lbStep(1); if(e.key==="ArrowLeft")lbStep(-1); });

load(); render();
</script>
</body>
</html>
